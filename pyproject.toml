[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-multica"
version = "1.0.0"
description = "Production-grade software delivery control for coding-agent teams on Multica"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "oh-my-multica contributors" }]
requires-python = ">=3.10"
keywords = [
    "ai-agents",
    "coding-agents",
    "harness-engineering",
    "loop-engineering",
    "multi-agent",
    "multica",
    "software-delivery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",
    "structlog>=24",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3.8,<4"]

[project.urls]
Homepage = "https://github.com/xiaohei-info/oh-my-multica"
Documentation = "https://github.com/xiaohei-info/oh-my-multica#readme"
Source = "https://github.com/xiaohei-info/oh-my-multica"
Issues = "https://github.com/xiaohei-info/oh-my-multica/issues"
Changelog = "https://github.com/xiaohei-info/oh-my-multica/blob/main/CHANGELOG.md"

[project.scripts]
omac = "omac.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omac.guide" = ["*.md", "roles/*.md", "artifacts/*.md", "en/*.md", "en/roles/*.md", "en/artifacts/*.md"]
"omac.web.static" = ["*"]
"omac" = ["agents/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: complete captured Source, native-boundary or recovery workflows; included by default, excluded only with an explicit marker selector.",
    "live: tests that hit a real platform (Multica/GitHub). Skipped by default in CI; run locally with `-m live`.",
    "e2e: CLI 子进程级端到端验收(mock 引擎)。稳定回归护栏,无 sleep 竞态(mock delay=0)。",
]

[tool.importlinter]
root_package = "omac"

[[tool.importlinter.contracts]]
id = "layers"
name = "Layering: web -> cli -> pipeline -> engines -> core -> i18n -> errors (function-level imports count)"
type = "layers"
layers = ["omac.web", "omac.cli", "omac.pipeline", "omac.engines", "omac.core", "omac.i18n", "omac.errors"]
ignore_imports = [
    # Permanent exception: `omac web` is the launcher of the web surface.
    "omac.cli.commands.web -> omac.web.server",
    # ---- Baseline: may only shrink; delete a line when its import is removed ----
    # Phase 1 (project-specific code removal)
    "omac.core.owner_amendment -> omac.cli.commands.dag",
    "omac.core.owner_amendment -> omac.pipeline.amendment",
    "omac.core.owner_amendment -> omac.pipeline.owner_amendment",
    "omac.core.owner_amendment -> omac.pipeline.portable_owner",
    "omac.core.owner_amendment -> omac.pipeline.tasks",
    "omac.core.owner_amendment -> omac.pipeline.worker_decision",
    "omac.core.owner_amendment -> omac.engines.models",
    "omac.core.current_owner_source -> omac.pipeline.amendment",
    "omac.core.current_owner_source -> omac.pipeline.owner_amendment",
    "omac.core.historical_review_source -> omac.pipeline.owner_amendment",
    "omac.core.prospective_owner -> omac.engines.models",
    "omac.core.credential_prospective -> omac.engines.models",
    "omac.core.literal_correction -> omac.engines.models",
    # Phase 3 (layering cleanup)
    "omac.core.amendment -> omac.engines.models",
    "omac.core.stage_recovery -> omac.engines.models",
    "omac.i18n -> omac.core.config",
    # Phase 8 (mock removal)
    "omac.engines.mock -> omac.pipeline.dispatch",
]

[[tool.importlinter.contracts]]
id = "adapters-via-factory"
name = "Concrete engine adapters are assembled only by the omac.engines factory"
type = "forbidden"
source_modules = ["omac.web", "omac.cli", "omac.pipeline", "omac.core"]
forbidden_modules = ["omac.engines.multica", "omac.engines.mock"]
allow_indirect_imports = true
