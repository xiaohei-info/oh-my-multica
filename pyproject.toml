[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-multica"
version = "2.0.0"
description = "Production-grade software delivery control for coding-agent teams on Multica"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "oh-my-multica contributors" }]
requires-python = ">=3.10"
keywords = [
    "ai-agents",
    "coding-agents",
    "harness-engineering",
    "loop-engineering",
    "multi-agent",
    "multica",
    "software-delivery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",
    "structlog>=24",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3.8,<4"]

[project.urls]
Homepage = "https://github.com/xiaohei-info/oh-my-multica"
Documentation = "https://github.com/xiaohei-info/oh-my-multica#readme"
Source = "https://github.com/xiaohei-info/oh-my-multica"
Issues = "https://github.com/xiaohei-info/oh-my-multica/issues"
Changelog = "https://github.com/xiaohei-info/oh-my-multica/blob/main/CHANGELOG.md"

[project.scripts]
omac = "omac.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omac.guide" = ["*.md", "roles/*.md", "artifacts/*.md", "en/*.md", "en/roles/*.md", "en/artifacts/*.md"]
"omac.web.static" = ["*"]
"omac" = ["agents/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: multi-component workflows (real git, local HTTP, subprocesses); included by default.",
    "live: tests that hit a real platform (Multica/GitHub). Skipped by default in CI; run locally with `-m live`.",
    "docker: integration tests on a private Docker Multica (tests/it); 30 s / 500 MB budget, Docker required, never skipped.",
]

[tool.importlinter]
root_package = "omac"

[[tool.importlinter.contracts]]
id = "layers"
name = "Layering: web -> cli -> pipeline -> engines -> core -> i18n -> errors (function-level imports count)"
type = "layers"
layers = ["omac.web", "omac.cli", "omac.pipeline", "omac.engines", "omac.core", "omac.i18n", "omac.errors"]
ignore_imports = [
    # Permanent exception: `omac web` is the launcher of the web surface.
    "omac.cli.commands.web -> omac.web.server",
    # ---- Baseline (may only shrink): empty ----
]

[[tool.importlinter.contracts]]
id = "adapters-via-factory"
name = "Concrete engine adapters are assembled only by the omac.engines factory"
type = "forbidden"
source_modules = ["omac.web", "omac.cli", "omac.pipeline", "omac.core"]
forbidden_modules = ["omac.engines.multica", "omac.engines.github"]
allow_indirect_imports = true
