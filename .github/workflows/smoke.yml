name: Smoke

# A real Coding Agent runs two minimal DAGs on a private Docker Multica. It is optional and runs only by hand, on the
# self-hosted runner where Codex and Pi are already signed in; it is never run for pull requests. Do not add
# pull_request or pull_request_target triggers: tests/test_architecture.py rejects them, because a self-hosted
# runner on a public repository can be used by fork pull requests.
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Coding Agent the Multica daemon launches
        type: choice
        options: [codex, pi]
        default: codex
      model:
        description: Model the Agents use (empty = the runtime's own default)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke (real agent)
    runs-on: [self-hosted, Linux, taiyi]
    timeout-minutes: 90
    env:
      OMAC_SMOKE_AGENT: real
      OMAC_SMOKE_RUNTIME: ${{ inputs.runtime }}
      OMAC_SMOKE_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -e ".[test]"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"   # the Agent runs `omac work submit`

      - name: Run the smoke DAGs
        run: python -m pytest tests/smoke -m live -o addopts="" -q

      - name: Clean up
        if: always()
        run: |
          python3 tests/it/cleanup.py   # safety net: stacks older than 2 h
          rm -rf "$RUNNER_TEMP/venv"
