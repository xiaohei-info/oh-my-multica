  - blocker_id: BLK-36d3e6907885
    root_cause_key: sealed-receipt-subtree-descendant-relink-rejected
    obligation_id: dimension:regression
    summary: The sealed receipt adapter rejects valid nested subtree attachment even
      though the shared data engine supports it.
    evidence: Source 9ce418cadca3cca358047d25c922207a08d856ed; sdk/harness/execution_receipt.go:374-399.
      After the root data tree is successfully relinked at :381, :389-390 recursively
      calls rebindExecutionReceiptParent on the ORIGINAL child receipt using the NEW
      parent identity. That original descendant is already linked to the old subtree-root
      identity. execution_measurement_tree.go:127-128 rejects its different parent
      digest. In contrast the historical implementation at 621ba1f7a2a45c9cf6072a3cc0c25cb27c727fb8
      relinked descendants after validating the attachment root, and the pure engine
      still does so at execution_measurement_tree.go:136-143. TestHarnessSDKMeasuredTreeCopyAndParentBinding
      at execution_measurement_tree_test.go:138-152 exercises only data-tree attachment,
      not authoritative wrapper relinking. This is a static control-flow finding;
      no prohibited Host proof was fabricated and no additional authority experiment
      was run.
    required_fix: Validate the authoritative parent and every original child node
      first, reject a differently bound attachment root, then rebuild the copied receipt
      wrappers from the shared engine's already-relinked immutable subtree while retaining
      only those previously validated per-node seals. Do not apply the external different-parent
      attachment guard again to legitimate internal descendant relinking, promote
      unsealed data, or relax root reparent rejection. Keep original snapshots unchanged.
      Rerun all declared SDK regressions and verification; the existing downstream
      Host-owned TestHarnessHostReceiptTreeAuthenticatesEveryNode must cover genuine
      nested attachment without SDK proof fixtures.
    status: open
    classification: new
    owner: harness-sdk
  - blocker_id: BLK-d5ac2fc7ef18
    root_cause_key: required-receipt-tree-design-audit-missing
    obligation_id: integration:harness-sdk-gate
    summary: Mandatory receipt-tree-design-evidence.md and the separate delivered
      four-regression output are absent from PR73.
    evidence: 'Source 9ce418cadca3cca358047d25c922207a08d856ed: exact read of artifacts/harness-sdk/receipt-tree-design-evidence.md
      returned file-not-found and git ls-tree HEAD confirms it is not tracked. git
      cat-file -e HEAD:artifacts/harness-sdk/receipt-tree-tests.json exits 128; the
      four-test file exists only after reviewer execution of the declared selector.
      The producer verification lists both paths as artifacts, but path declarations
      alone are not artifacts. All four tests independently pass; that does not establish
      the missing design audit.'
    required_fix: Publish artifacts/harness-sdk/receipt-tree-design-evidence.md and
      the actual separate four-test output. Include exact committed source/toolchain/profile
      hashes, before/after production call graphs, every affected old-to-new block/function
      mapping including Host-only code, raw covered/total counts, semantic explanation
      of each denominator change, actual four named regression results, exported API/JSON/canonical
      digest compatibility and a validation/ownership preservation map. Keep the 50-test/13-row
      ledger unchanged and genuine Host obligations not-run. Do not create extra production
      behavior or alter quality/security gates to close an evidence requirement.
    status: open
    classification: new
    owner: harness-sdk
