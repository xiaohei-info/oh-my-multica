      to that repair. It does not map the original proof-coupled validateWithParent,
      cloneExecutionReceipt, digest/child projection, newExecutionReceipt/newGateExecutionReceipt
      and semantic adapter to the new shared engine and fixed-runner callers. Lines
      44-48 explain only the 2246-to-2229 reduction, not the original 2018-to-2229
      redesign. coverage-block-audit.json contains current function_callers and current
      profile blocks only; its top-level schema has no historical graph or old-to-new
      block mapping. The audit and four-test output now exist and their hashes/counts
      are valid, so this is a deeper incomplete-content finding rather than continued
      absence.
    required_fix: Extend the existing source-bound audit with the full original-to-current
      call graphs and affected block/function mapping for the approved representation
      change, including Host-only guards, shared-engine functions, runner projections/attachments,
      authoritative adapters and semantic writer. Map retained/redundant validation
      and account for the entire denominator transition. Preserve historical source/profile
      pairs and keep all security and coverage gates unchanged; no production padding
      or Host fixtures are needed to repair this documentation/evidence defect.
    status: open
    classification: deeper
    owner: harness-sdk
    last_evidence: PR73 972a9b5e0454a93d351e2bbee4f87f4b8f78055a, selected source
