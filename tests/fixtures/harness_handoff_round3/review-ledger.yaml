  - blocker_id: BLK-d4085e4d8609
    root_cause_key: implementation-mutable-request-not-snapshotted-before-sealing
    obligation_id: dimension:authority
    summary: Implementation dispatch shares mutable request slices with the scope
      later captured in measurement trees and authoritative receipt seals.
    evidence: Static control-flow evidence at selected source d54256aad13eb228e1aec4e1b6ffff13369891e6;
      no additional negative experiment or Host-proof fixture was constructed. sdk/harness/typed_execution_receipt.go:195-207
      validates request.Scope before dispatch, passes the same slice-bearing request
      through executeTypedExtension at :235, then supplies request.Scope to newExecutionReceipt.
      The ordinary runner likewise stores request by value at conformance.go:607 and
      constructs its tree after dispatch at :644-645. Executor runner conformance.go:563-564
      copies Input but retains the original scope slices before invoking the closure;
      :588 constructs the tree afterward. Executor production executeWithReceipt at
      execution_receipt.go:432-447 also seals request.Scope after forwarding it to
      the implementation. RequestScope.Permissions and InvocationIdentity.Entrypoint.Args
      are slices; the dispatch/counter functions do not detach them. newExecutionReceipt
      at execution_receipt.go:305-332 validates transport data and the trusted attestation
      marker, but does not compare the post-call scope with the original Host proof.
      validateWithParent at :190-205 subsequently compares against the newly captured
      snapshot. The added TestHarnessSDKRejectsImplementationMutatedRequest at typed_response_validation_test.go:70-95
      checks only mutation into an unsupported permission, which the later shape validator
      rejects; it does not establish isolation of well-formed identity/scope changes.
    required_fix: Before untrusted implementation dispatch, retain an independent
      immutable snapshot of the complete originally validated request/scope and pass
      detached mutable DTO data to the implementation. Build measurements and receipts
      from that original snapshot, or reject any post-call projection mismatch without
      sealing changed identity. Apply the same rule to typed and Executor Execute/Observe/Cancel
      paths and preserve existing authority-check ordering, public API and canonical
      bytes. Add ordinary SDK regressions for copy isolation and well-formed slice
      mutations; keep genuine Host-positive checks in the already declared downstream
      Host tests, not SDK proof fixtures. Regenerate all source-bound verification/evidence
      after the substantive correction.
    status: open
    classification: new
    owner: harness-sdk
