    status: pass
    evidence: "Trace-only reference: validated existing request/action wire boundaries and the resource suite; this node does not claim the whole user journey."
  - acceptance: UJ-EXECUTOR-RESOLUTION-001
    status: pass
    evidence: "Trace-only reference: named tests validate foreign identity rejection, exact persisted fact and responsibility/lineage preservation at the resource boundary."
