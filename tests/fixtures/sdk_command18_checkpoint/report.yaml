    side of opaque service and Gate handoffs. The SDK must define a usable Host-facing ingress contract without implementing
    the Host producer: arbitrary callers and ExtensionPackages must be unable to mint an authoritative RequestScope, GateEvaluatorBinding,
    receipt, or evaluator invocation. Replace the obsolete missing-symbol regression with a structurally valid attempt against
    the current public API and prove zero binding, receipt, and evaluator calls. Remove all SDK-owned or same-package test-only
    Host authority bridges. Every SDK-local fixture must emit source-revision-bound measured evidence for its exact scoped
    assertion; the Gate consumer row may pass only by proving the negative boundary, must report registered_gate_positive_path_count=0
