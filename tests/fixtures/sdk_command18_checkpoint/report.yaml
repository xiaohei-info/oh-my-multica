    typed operation-schema validation, successful Trigger/EventHandler, bounded offline schema resolution, Required/Optional
    behavior, Unknown recovery, safe retry/cancel, coverage, race, vet, and deterministic sdk/harness packaging. The mandatory
    genuine Host-installed positive path and final combined semantic verdict remain downstream responsibilities of harness-host
    and contracts-extension. SDK-local positive operation conformance is not Host authorization: the fixed SDK conformance runner
    may execute ordinary typed Describe/Guide/Sensor/Executor/Trigger/EventHandler implementations with deterministic, non-authoritative
    request data and the same production input/response/schema/outcome validation and receipt-classification code. Its measured
    conformance records must be explicitly scoped sdk-operation-conformance, must not construct trusted RequestScope, service/Gate
    handoffs or authoritative receipts, and must never be usable by production authority entry points. A helper-only predicate
    or direct implementation call that bypasses the shared validation/measurement path is insufficient. Preserve successful
    Trigger output and all three successful EventHandler lifecycle operations; error-only implementations must fail these
    positive fixtures. Production typed Guide/Sensor/Trigger/EventHandler paths must finish response and output-schema validation
    before accepting a receipt; invalid results yield rejected/failed measured outcomes, while valid business-error envelopes
    retain a separate failed business outcome and never count as positive operation success. Optional side-effecting failures
    may become skipped only when the external failure outcome is known; structured Unknown and unstructured errors remain
    Unknown and require observation/recovery. SDK service/Gate rows are exclusively sdk-consumer-negative: reject even internally
    consistent caller handoffs without issuing a binding, authoritative receipt, or implementation/evaluator call. Envelope,
    rotation, replay, payload and identity assertions in these rows prove rejection of untrusted candidates, not authentication
    or durable replay enforcement. The Host-facing ingress contract must be package-neutral and implementable by the separately
    owned harness-host producer, not an unconditional rejecting stub or a caller-selectable verifier; document the exact release/entrypoint,
    binding, operation, owner, subject, scope, request/service-payload digest, component/run, policy and evaluator identity
    handoff. Host-owned verification, configured trust, expiry/rotation and replay enforcement remain in harness-host. The
    existing downstream dependency harness-host consumes harness-sdk-boundary-evidence and produces harness-host-gate-evidence
