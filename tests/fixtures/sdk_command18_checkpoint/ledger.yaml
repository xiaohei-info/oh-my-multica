  - blocker_id: BLK-b1b208243999
    root_cause_key: harness-sdk-repair-published-semantic-ledger-overwritten-by-full-suite
    obligation_id: dimension:evidence
    summary: The immutable repair publication contains the post-full-suite semantic
      file, which no longer passes the unchanged fixed 50-test ledger gate.
    evidence: 'At publication commit 8bbf89abc19d1e9d77aa6a4d97375a43ef9f1c96, artifacts/harness-sdk-build-repair-evidence/semantic-evidence.json
      has SHA-256 2dcaeae5cd056b2e0c06152fed7b155c73fd4e36a12b609fee14fa04ab90e307
      and omits metrics.required_harness_conformance_test_count. Its archive contains
      the identical bytes. With these delivered payloads at the inherited paths and
      git HEAD=1ebf12d36d29c2a3726257bd03685139f5bc568a, exact command 18 exits 1:
      KeyError: ''required_harness_conformance_test_count''. I independently ran all
      23 exact commands in original order: all exited 0 when executed. A read-only
      checkpoint immediately after command 18 contained the measured count 50 and
      SHA-256 5e709ad69d68c6971a655a70f75a3cb754930b9f0f7c864a6f8d29304ee27670. Command
      23 rewrote that file to the exact published hash, removing only this metric.
      The source cause is sdk/harness/semantic_evidence_test.go:319-325 (metric emitted
      only with HARNESS_SDK_SEMANTIC_EVIDENCE set) and :386-396 (unset env still writes
      the default gate path). The final transcript independently contains all 50 passing
      required tests, so this is an evidence-harvesting failure, not missing executed
      tests or a production SDK behavior defect.'
    required_fix: Keep PR90 and its one-line production diff. At its stable committed
      submitted HEAD, run all 23 commands unchanged in original order and the required
      native environment, preserving the actual validated semantic bytes from the
      fixed-selector generation/command-18 checkpoint before the unchanged full suite
      rewrites its default output. Publish that measured checkpoint together with
      all other required fresh same-HEAD artifacts, command exits and source bundle
      in a new immutable evidence set; recompute and verify index/archive hashes and
      rerun exact command 18 against the published bytes. Preserve prior publications
      as history. Do not synthesize the metric, relabel an unvalidated output, change
      SDK/test behavior, alter the original commands or gates, create a dummy source
      commit, or claim Host90/whole-SDK90/merge/Audit completion.
    status: open
    classification: new
    owner: harness-sdk
