      commands pass.'
    required_fix: Preserve PR90 and its one-line SDK diff. At the stable final submitted
      PR HEAD rerun all 23 commands in the original order/environment, regenerate
      every required SDK/repair artifact with that exact source_revision, and publish
      a new immutable source-bound evidence set plus fresh OMAC verification identifying
      the same HEAD. Use external immutable publication/attachments if needed to avoid
      an artifact-only commit advancing HEAD after generation; do not relabel old
      outputs, weaken equality gates, overwrite historical deliveries, create a duplicate
      PR, or change SDK behavior.
    status: open
    classification: new
    owner: harness-sdk
