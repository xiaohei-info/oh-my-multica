objective: 'Restore the current main Preview governed Decision write path against
  the already merged canonical AuditEvent/EvaluatedControl vocabulary, without changing
  that shared contract. The exact e8b8dfb6430208e4bd32c8134dbb6c19f24ad566 source
  has incompatible production validation at internal/softwaredelivery/preview/decision_writer.go:363-379
  (requires authorization outcome pass), while contracts/governance/audit/audit.go:36-50,84-106
  accepts only allowed/denied for authorization/admission. Existing acceptance_test.go:483-518
  fixtures emit authorization/pass and an undeclared preview-decision/pass control.
  Correct both the Preview consumer validator and its fixtures to use the canonical
  approved vocabulary and preserve exact evidence binding; fixing only fixtures cannot
  close the production contradiction. Keep Preview decision identity, human authorization,
  exact subject/digest, policy provenance, atomic Decision/CommandRecord/AuditEvent/Outbox
  persistence, replay, CAS, uniqueness and restart behavior unchanged. Authorization
  for a successful write must be canonical allowed, not denied or pass; preserve all
  original tampering and rollback assertions. Represent the decision with the existing
  event action/subject/outcome, not an invented governance control.


  This is one compensating owner PR to main, owned by the existing release-preview
  producer codex-macmini-newapi, not reopening completed release-preview or replacing
  the later Audit schema transition. Work against merged main and its current canonical
  Audit contract; do not cherry-pick unreviewed PR78 or PR90, and do not depend on
  contracts-audit-usage or harness-sdk-production-build-repair (that would create
  a cycle). If the exact repair requires new wire vocabulary, persistence migration,
  API/security semantics or unrelated scope, stop for a precise user decision rather
  than making the choice.


  Preserve all five original release-preview verification commands and gate semantics
  (using a fresh repair artifact directory), 90 percent combined Release/Preview coverage,
  and all five required recovery regressions. Add three named regressions: TestPreviewCanonicalAuthorizationAuditAllowsGovernedCommit
  proves a canonical allowed event reaches the real commit/atomic store path for approve
  and request_changes; TestPreviewCanonicalAuthorizationAuditRejectsNonCanonicalControls
  rejects pass, unknown, denied authorization on successful writes and undeclared
  control identities before any write; TestPreviewCanonicalAuthorizationAuditRejectsConflictingProvenance
  rejects duplicate or conflicting authorization evidence at submission and commit,
  without losing existing policy-version/digest checks. Add no fake pass counters.
  The full existing Preview suite must pass uncached, as must unchanged canonical
  audit and credential suites.


  Publish immutable release-preview-audit-vocabulary-repair-evidence containing coverage,
  existing and new JSON test transcripts, original-owner source bundle/manifest/digest,
  and owner-repair.md with before/after source SHAs, source patch, exact environment/command
  exits, root cause and no-API/security-regression analysis. Source bundle ownership/component
  remains release-preview; the new DAG ID is not a packaging owner. All artifacts
  must be retrievable and bound to the same committed submitted PR HEAD. Independent
  review and merge precede SDK recovery; a proposed fix or local pass is not acceptance.
  Transitional consumes is deliberately omitted because completed release-preview
  and contracts-credential do not declare trustworthy typed outputs; only their merged
  source is consumed, no undocumented downstream input.'
non_goals:
- Do not include a free clock timestamp in preview Decision identity or idempotency
  comparison; timestamps are record fields only.
- Do not accept substring, member, partial-set, latest-record, or other non-equality
  evidence binding in place of exact preview input digest equality.
- Do not depend on an external regression system; the Preview generator owns the expected-versus-actual
  difference record for the same normalized input set.
- Do not allow reuse of a logical Decision identity under another idempotency key
  to append or overwrite governed Decision, CommandRecord, AuditEvent, Outbox, or
  commit indexes; exact replay or deterministic conflict is required.
- Do not return PreviewNotReady for a previously approvable submitted subject made
  stale by changed authoritative preview facts; return the existing StaleSubject/Conflict
  semantics for both approve and request_changes.
- Do not create a ReleaseCandidate, PreviewAcceptance, approval Version, hidden remediation
  aggregate, or direct WorkUnit/DAG creation path.
- Do not modify contracts/governance/audit, credential, Usage, Harness SDK, Workspace
  filesystem, Runtime, Platform resource or Kernel production code, and do not copy
  a canonical validator or add a compatibility alias or accept legacy pass controls.
- Do not alter any accepted done/merged node, live manifest, original acceptance owner/contributions,
  closed Audit vocabulary, shared wire/API shape, persistence format, authorization
  policy, Preview subject/CAS/idempotency algorithm, or coverage/test assertion. Existing
  test fixture values must become valid canonical inputs, not weaker assertions.
- Do not deploy Preview resources, operate a Kubernetes cluster/namespace or perform
  live fault injection. Deterministic in-process/temp-directory tests do not constitute
  live user-journey or Workspace conformance.
- Do not port unreviewed PR78 or claim to close its retained e15cd8 report/35afd7
  ledger. Audit remains responsible for its later atomic canonical schema transition
  and all existing fresh-HEAD gates.
verification_commands:
- mkdir -p artifacts/release-preview-audit-vocabulary-repair && go test -covermode=atomic
  -coverprofile=artifacts/release-preview-audit-vocabulary-repair/coverage.out ./internal/softwaredelivery/release/...
  ./internal/softwaredelivery/preview/...
- python3 -c "from pathlib import Path; import re,subprocess; p=Path('artifacts/release-preview-audit-vocabulary-repair/coverage.out');
  assert p.is_file() and p.stat().st_size>0; out=subprocess.check_output(['go','tool','cover','-func='+str(p)],text=True);
  m=re.search(r'^total:\s+\(statements\)\s+([0-9.]+)%$',out,re.M); assert m and float(m.group(1))
  >= 90"
- mkdir -p artifacts/release-preview-audit-vocabulary-repair && go test -json ./internal/softwaredelivery/release/...
  ./internal/softwaredelivery/preview/... -run '^(TestPreviewDecisionIdempotencyUsesCanonicalInputDigestNotClock|TestPreviewEvidenceSubjectRequiresExactInputDigestEquality|TestPreviewGeneratorRecordsExpectedActualRegressionDifference|TestPreviewDecisionIdentityReuseCannotOverwriteGovernedRecords|TestPreviewChangedFactsReturnStaleSubjectForApproveAndRequestChanges)$'
  -count=1 > artifacts/release-preview-audit-vocabulary-repair/preview-recovery-tests.json
- 'python3 -c "import json; required={''TestPreviewDecisionIdempotencyUsesCanonicalInputDigestNotClock'',
  ''TestPreviewChangedFactsReturnStaleSubjectForApproveAndRequestChanges'', ''TestPreviewGeneratorRecordsExpectedActualRegressionDifference'',
  ''TestPreviewDecisionIdentityReuseCannotOverwriteGovernedRecords'', ''TestPreviewEvidenceSubjectRequiresExactInputDigestEquality''};
  rows=[json.loads(x) for x in open(''artifacts/release-preview-audit-vocabulary-repair/preview-recovery-tests.json'')
  if x.strip()]; passed={x.get(''Test'') for x in rows if x.get(''Action'')==''pass''
  and x.get(''Test'') in required}; assert passed==required, f''missing required passing
  preview recovery tests: {sorted(required-passed)}''"'
- python3 scripts/release/package_component.py --component release-preview --kind
  platform-core-dependency-source --input internal/softwaredelivery/release --input
  internal/softwaredelivery/preview --bundle artifacts/release-preview-audit-vocabulary-repair/source-bundle.tar.zst
  --component-manifest artifacts/release-preview-audit-vocabulary-repair/component-manifest.json
  --digest-output artifacts/release-preview-audit-vocabulary-repair/bundle-digest.txt
  --ownership-baseline contracts/release/source-ownership-baseline.yaml --owner release-preview
  --require-all-owner-sources-accounted
- go test -count=1 ./internal/softwaredelivery/release/... ./internal/softwaredelivery/preview/...
  ./contracts/governance/audit/... ./contracts/governance/credential/...
- go vet ./internal/softwaredelivery/preview/...
- CGO_ENABLED=1 go test -race -count=1 ./internal/softwaredelivery/preview/...
- mkdir -p artifacts/release-preview-audit-vocabulary-repair && go test -json -count=1
  ./internal/softwaredelivery/preview/... -run '^(TestPreviewCanonicalAuthorizationAuditAllowsGovernedCommit|TestPreviewCanonicalAuthorizationAuditRejectsNonCanonicalControls|TestPreviewCanonicalAuthorizationAuditRejectsConflictingProvenance)$'
  > artifacts/release-preview-audit-vocabulary-repair/canonical-audit-tests.json
- python3 -c 'import json; from pathlib import Path; required={'"'"'TestPreviewCanonicalAuthorizationAuditRejectsConflictingProvenance'"'"',
  '"'"'TestPreviewCanonicalAuthorizationAuditRejectsNonCanonicalControls'"'"', '"'"'TestPreviewCanonicalAuthorizationAuditAllowsGovernedCommit'"'"'};
  rows=[json.loads(x) for x in Path('"'"'artifacts/release-preview-audit-vocabulary-repair/canonical-audit-tests.json'"'"').read_text().splitlines()
  if x.strip()]; assert {r.get('"'"'Test'"'"') for r in rows if r.get('"'"'Action'"'"')=='"'"'pass'"'"'
  and r.get('"'"'Test'"'"') in required}==required; assert not any(r.get('"'"'Action'"'"')
  in {'"'"'fail'"'"','"'"'skip'"'"'} for r in rows)'
