      component-manifest.json, bundle-digest.txt, and owner-repair.md with before/after
      source SHAs, exact patch, environment and command exits, root cause and no-API/security-regression
      analysis. Preserve owner/component release-preview and bind all published artifacts
      to the final committed submitted PR HEAD. Resubmit the actual artifact lineage,
      not local paths or pass counters.
