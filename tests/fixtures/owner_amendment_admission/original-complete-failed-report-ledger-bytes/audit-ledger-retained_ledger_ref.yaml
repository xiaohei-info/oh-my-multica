      a PostgreSQL authority for active Workflow state. Design 09-governance-and-security-detailed-design.md:574,829
      and the contract require the real facts/CommandRecord/Outbox and AuditEvent
      to share the transaction. Static inspection and declared tests only; no added
      experiments.
  - blocker_id: BLK-732e9d6d73f9
    root_cause_key: audit-evidence-assembly-only-in-test-doubles
    obligation_id: integration:audit-ledger-gate
    summary: Application-owned evidence assembly now exists, but related-fact ports
      discard the exact historical identities needed to resolve the committed evidence
      chain.
    evidence: internal/audit/evidence.go:37-62 gives CredentialUseReference only BindingID/Purpose
      and GovernanceRecordReference only Kind/ID. The credential list gets event/context
      IDs at :155, but LoadCredentialUse at :180 receives only scope/project and that
      lossy reference; PersistedCredentialUse has no persisted-use/event/context identity
      to verify at :184-186. Governance assembly :111-130 uses anchor revision/digest
      for authorization but drops both before LoadGovernanceRecord, which returns
      only availability. Tests still supply binding-keyed facts and Kind/ID-keyed
      availability (application_test.go:744-785); the declared detail tests pass but
      cannot distinguish two persisted uses of the same binding or two revisions of
      a policy. Exact persisted RequestContext identity and per-linked-subject authorization
      are substantially improved (:95-108, :217-228); those improvements do not repair
      exact related-fact resolution required by design :650-663. Static inspection
      and declared tests only.
    required_fix: Retain an exact immutable persisted credential-use selector and
      its event/request-context binding in the narrow reference/load result, and validate
      it against the committed anchor before using the fact. Pass the evaluated control
      revision/digest (and any required immutable record identity) through the governance
      reader so availability describes that historical record, not merely its stable
      policy ID. Keep assembly/authorization/redaction application-owned. Extend the
      declared detail tests with distinct persisted uses sharing one binding and distinct
      policy revisions, including missing/retained-away historical evidence and mismatch
      rejection; do not change the published Audit wire/seal.
    status: open
    classification: deeper
    owner: audit-ledger
    last_evidence: internal/audit/evidence.go:37-62 gives CredentialUseReference only
