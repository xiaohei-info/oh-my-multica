  - blocker_id: BLK-24e444819f31
    root_cause_key: audit-shared-business-transaction-missing
    obligation_id: integration:audit-receipt-store-boundary-gate
    summary: The new unit of work atomically stores JSON copies of participants, not
      the domain facts and actionable CommandRecord/Outbox in their authoritative
      persistence paths.
    evidence: At reviewed HEAD, internal/audit/commit/commit.go:19-43 defines generic
      Kind/ID/Revision/RawMessage business facts. contracts/governance/audit/store/postgres.go:71-132
      starts its own transaction and only inserts audit_commit_records plus audit_events;
      schema.go:64-80 puts business_facts, command_payload and outbox_payload in the
      audit-owned commit row. Complete production usage inspection finds no domain
      writer or command/outbox consumer for these fields. The independently passing
      TestAuditAtomicCommitRollbackAndIdempotency (internal/audit/application_test.go:156-255)
      reads and rolls back only those two audit-owned tables; its business failure
      is an INSERT failure on audit_commit_records, not an authoritative domain mutation.
      The copied workflow-state fact at application_test.go:224-240 also cannot be
      a PostgreSQL authority for active Workflow state. Design 09-governance-and-security-detailed-design.md:574,829
      and the contract require the real facts/CommandRecord/Outbox and AuditEvent
      to share the transaction. Static inspection and declared tests only; no added
      experiments.
    required_fix: Replace the shadow participant payload store as the proof of business
      atomicity with a platform-internal typed commit boundary that applies the owning
      domain persistence operation and applicable real CommandRecord/Outbox persistence
      in the same transaction as the canonical AuditEvent. Preserve domain ownership
      and the Workflow CR authority; do not expose generic SQL executors or receipt
      issuance. Exercise that production boundary in the declared atomicity tests
      and assert authoritative domain and dispatchable command/outbox state, rollback
      on either participant failure, replay and digest/CAS conflicts. Keep receipts
      on subsequent committed reads.
    status: open
    classification: deeper
    owner: audit-ledger
    last_evidence: At reviewed HEAD, internal/audit/commit/commit.go:19-43 defines
      generic Kind/ID/Revision/RawMessage business facts. contracts/governance/audit/store/postgres.go:71-132
