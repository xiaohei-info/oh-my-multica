  - blocker_id: BLK-22c78fb9f46d
    root_cause_key: audit-authorization-decision-not-bound-to-request
    obligation_id: dimension:execution
    summary: Audit authorization consumes any structurally valid decision without
      checking its RequestDigest against the current authorization request.
    evidence: internal/audit/application.go:289-304 builds an AuthorizationRequest
      but, after Authorize, only calls decision.Validate. contracts/governance/authz/contract.go:185-196
      defines the decision as provenance for one RequestDigest; Validate:209-232 merely
      requires the digest to be nonempty and validates structural fields. No comparison
      to the submitted request occurs in the complete production audit paths. Existing
      independently passing tests use partial invented request digests (application_test.go:303-312;
      api/audit/api_test.go:118-122) and test invalid/empty decisions, not structurally
      valid mismatched decisions. Finding is from source inspection; no undeclared
      bypass experiment was run.
    required_fix: Bind the returned decision to the exact authorization request under
      the platform’s canonical request-digest contract before consuming its effect
      or writing provenance; reject mismatched/unknown decision authority. Apply this
      consistently through the shared authorize helper and extend the declared authorization
      tests to cover structurally valid decisions bound to another scope/project/principal/action/subject
      and sensitive-read request.
    status: open
    classification: new
    owner: audit-ledger
  - blocker_id: BLK-24e444819f31
    root_cause_key: audit-shared-business-transaction-missing
    obligation_id: integration:audit-receipt-store-boundary-gate
    summary: The only production append path commits an audit-only transaction; it
      cannot participate in the required domain/CommandRecord/Outbox transaction.
    evidence: contracts/governance/audit/store/postgres.go:63-107 unconditionally
      begins its own transaction, inserts only audit_events and commits it. internal/audit/application.go:48-54,106-118
      exposes only independent Append, with no application unit-of-work path. TestAuditAtomicCommitRollbackAndIdempotency
      (postgres_test.go:221-254) passed independently, but inspects only audit_events;
      it never writes or rolls back a domain row, CommandRecord or Outbox. The complete
      PR diff contains no other shared-commit implementation. This conflicts with
      design section 8.1 (09-governance-and-security-detailed-design.md:574), section
      13:829, and the node contract’s shared transaction requirement.
    required_fix: Provide a typed, platform-internal unit-of-work/commit path that
      atomically includes business facts and applicable CommandRecord/Outbox plus
      the canonical AuditEvent, without exposing a generic public SQL executor or
      receipt authority. Keep receipt issuance on a separate committed read. Extend
      the declared atomicity test to drive the production shared-commit path and prove
      rollback of every participant on audit and business failures, replay and conflicting
      digests.
    status: open
    classification: new
    owner: audit-ledger
  - blocker_id: BLK-732e9d6d73f9
    root_cause_key: audit-evidence-assembly-only-in-test-doubles
    obligation_id: integration:audit-ledger-gate
    summary: Production detail evidence resolution and per-linked-subject authorization
      are not implemented; the application delegates them to an assembled-DTO callback.
    evidence: internal/audit/application.go:62-75 declares BuildDetail returning an
      already-assembled DetailEvidence; lines 201-211 copy it into the sealed view
      and structurally validate it. api/audit/api.go:14-18,27-43 requires the caller
      to supply that implementation. Repository symbol/usages inspection found BuildDetail
      implementations only in test files. internal/audit/application_test.go:338-369
      fabricates RequestContextSummary from the event, supplies a fixed RequestID
      and predetermined availability/redaction values, ignores the caller, and performs
      no linked-subject authorization. TestAuditDetailAuthorizationAndRedaction:47-98
      passed, but its not_authorized assertion checks that hard-coded fixture rather
      than an authorization decision for a loaded linked subject. api/audit/api_test.go:128-133
      likewise synthesizes context evidence. Contract Validate:1281-1353 checks shape/provenance
      consistency, not the caller’s right to a linked subject. Design sections 8.4-8.5
      require exact identity resolution and per-subject visibility.
    required_fix: Implement evidence assembly in internal/audit using narrow typed
      ports for exact persisted context and related facts, plus the platform authorizer
      for each linked subject/field. Wire the actual assembler in api/audit rather
      than requiring a caller-supplied complete detail DTO. Keep underlying repository
      dependencies injectable, but retain application-owned authorization/redaction
      and explicit unavailable/redacted/not_authorized results. Revise the declared
      detail test to resolve distinct persisted context and related records and prove
      real caller-specific authorization, missing/retained-away records and sensitive-field
      denial.
    status: open
    classification: new
    owner: audit-ledger
  - blocker_id: BLK-eca90b3218a1
    root_cause_key: audit-schema-compatibility-verified-by-names-only
    obligation_id: dimension:structure
    summary: Reopen accepts a migration checksum without verifying the actual deployed
      table, constraints, indexes or append-only trigger semantics.
    evidence: contracts/governance/audit/store/schema.go:86-105 compares the stored
      version/checksum with a checksum of local statement strings. verifySchema:131-158
      then uses SELECT ... LIMIT 0, counts seven index names, and checks only trigger
      name/relation existence. It does not inspect column types/nullability/collations,
      primary/unique/check constraints, index definitions/validity, or trigger enabled
      state, event mask and function identity. On the already-versioned branch it
      does not execute the schema statements. schema_test.go:80-99 covers absent indexes/triggers,
      not present-but-incompatible definitions. This is a static source finding, not
      an additional attack experiment; the existing declared schema tests all passed.
    required_fix: Validate the supported schema’s real PostgreSQL catalog definitions
      and enabled append-only enforcement, including immutable identity/idempotency
      constraints and numeric key ordering. Fail closed with an owner-decision error
      for incompatible existing structures; do not rewrite records or destructively
      migrate. Extend the declared schema compatibility tests to cover present-but-incompatible
      columns, constraints, indexes and disabled/wrong triggers, retaining idempotent
      valid reopen and restore.
    status: open
    classification: new
    owner: audit-ledger
