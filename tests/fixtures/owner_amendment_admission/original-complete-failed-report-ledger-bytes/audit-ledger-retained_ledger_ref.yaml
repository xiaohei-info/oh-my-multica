      and declared tests only.
  - blocker_id: BLK-eca90b3218a1
    root_cause_key: audit-schema-compatibility-verified-by-names-only
    obligation_id: dimension:structure
    summary: Catalog validation was expanded, but reopen still does not establish
      unconditional append-only trigger enforcement.
    evidence: contracts/governance/audit/store/schema.go:498-519 validates tgenabled,
      tgtype, function identity/language/security mode and normalized function source,
      but never reads pg_trigger.tgqual or tgattr. Those catalogs independently determine
      trigger predicates and UPDATE-column applicability and are not represented by
      the checked event mask/function identity. On the existing supported-version
      branch (:141-150), migration only validates and does not replace the trigger.
      The declared incompatible-schema tests (schema_test.go:183-348) cover types/nullability/collation/constraints/index
      ordering/disabled/wrong-event/wrong-timing/wrong-function triggers, and all
      passed; none cover conditional or column-limited enforcement. The original name-only
      checks are substantially repaired, but this same enforcement root remains incomplete.
      This is a static finding; no additional negative experiment or payload was constructed.
    required_fix: Compare the complete supported trigger enforcement definition, explicitly
      requiring no WHEN predicate and no restricted UPDATE-column list, as well as
      the existing event/timing/function checks. Reject incompatible deployed definitions
      with an owner-decision error rather than repairing them destructively. Add these
      compatibility cases to the declared schema tests, retaining valid idempotent
      reopen, v1 upgrade and restore.
    status: open
    classification: deeper
    owner: audit-ledger
    last_evidence: contracts/governance/audit/store/schema.go:498-519 validates tgenabled,
