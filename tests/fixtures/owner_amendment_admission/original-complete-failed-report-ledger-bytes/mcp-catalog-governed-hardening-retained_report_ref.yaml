      "impact": "The delivery proves application behavior against a private JSON fixture, not restart-safe canonical persistence or actual runtime consumption. No production implementation can instantiate the new governed path at this head using the delivered ports.",
      "evidence": "internal/mcp/governed.go:258-267 declares MCPStore; :320-333 declares/injects runtime and governance ports. Repository-wide symbol/implementation searches find ReserveCommand and CommitCommand(MCPCommandCommit) implementations only in internal/mcp/governed_test.go:650-730, and the new runtime signature only in the same test file at :555-578. GovernedMCPUseCase has no non-test composition site. The restart tests reopen testMCPStore JSON at :624-634; testMCPRuntime calculates a launch and manufactures a ready proof at :573-578 without consuming it. All seven changed files are under internal/mcp. The contract calls for durable command reservation/replay and exact authoritative runtime materialization, not just a port declaration.",
      "required_fix": "Implement and exercise adapters into the existing canonical Platform Core transaction/persistence owner and Runtime/AgentRun owner, with production-capable component composition. Prove atomic definition/command/audit persistence, durable restart/replay, unknown reservation retention, and proof emitted by actual launch consumption. Keep these adapters on the canonical authorities; do not add an MCP-local persistence store, runtime, or audit ledger, and do not change public HTTP/OpenAPI DTOs."
    },
    {
      "root_cause_key": "mcp-governance-audit-projection-used-as-decision",
      "obligation_id": "dimension:ownership",
      "classification": "new",
      "severity": "high",
      "summary": "Authorization and Admission ports return audit projections instead of exact canonical decisions.",
      "impact": "The use case cannot verify that an allow/admit result belongs to the evaluated request or retain/enforce the canonical decision obligations, constraints, required checks, and freshness. A syntactically populated audit control is accepted as authority.",
      "evidence": "internal/mcp/governed.go:73-79 returns audit.EvaluatedControl for both decisions; :865-907 validates only that projection. audit.EvaluatedControl and its provenance at contracts/governance/audit/contract.go:78-158 have no request digest or evaluation time. In contrast, contracts/governance/authz/contract.go:185-232 defines AuthorizationDecision with request digest, policy provenance, paired matched grants, obligations, and evaluated time; contracts/governance/admission/contract.go:471-553 defines ExecutionAdmissionDecision with request digest, required check keys, temporal validation, and constraints. The MCP tests return fixed controls at internal/mcp/governed_test.go:409-430 and do not exercise canonical decisions. docs/design/detailed/09-governance-and-security-detailed-design.md:296 and :367-402 prohibit cross-request reuse and require the exact decisions in the persistence boundary.",
      "required_fix": "Consume the existing typed AuthorizationDecision and ExecutionAdmissionDecision contracts through canonical owner adapters. Verify exact request-digest linkage, retain full decision lineage, and propagate/enforce any tightening obligations and constraints before connector/runtime execution. Derive audit EvaluatedControl only after validating authoritative decisions; persist the decisions and audit links through the canonical transaction owner."
    },
