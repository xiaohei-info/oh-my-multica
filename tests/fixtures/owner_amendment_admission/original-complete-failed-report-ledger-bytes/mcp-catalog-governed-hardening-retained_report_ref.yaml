      "root_cause_key": "mcp-audit-request-id-context-id-conflation",
      "obligation_id": "dimension:evidence",
      "classification": "new",
      "severity": "medium",
      "summary": "Audit validation incorrectly equates external request_id with persisted request_context_id.",
      "impact": "A canonical audit event carrying a distinct persisted RequestContext identity is rejected. Events built to satisfy the current check instead lose the canonical persisted context linkage required by Audit Explorer.",
      "evidence": "internal/mcp/governed.go:928 requires event.RequestContextID == command.RequestContext.RequestID. internal/mcp/governed_test.go:446 fabricates the event using the same equality. contracts/identity/requestcontext/request_context.go:37 exposes external RequestID; docs/references/governance/security-and-enterprise.md:305-317 expressly distinguishes persisted request_context_id and external request_id and requires authority-issued store binding.",
      "required_fix": "Carry the canonical persisted RequestContext identity/receipt from the existing governance persistence boundary separately from the external request ID. Validate audit attribution against that canonical identity and preserve both identities in their intended fields. Update the declared lineage regression to use distinct request and persisted context IDs."
