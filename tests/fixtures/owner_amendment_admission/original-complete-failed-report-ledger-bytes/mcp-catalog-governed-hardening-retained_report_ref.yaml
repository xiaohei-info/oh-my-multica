      "obligation_id": "dimension:execution",
      "classification": "new",
      "severity": "high",
      "summary": "Inline Header and Environment values are still classified by heuristics, not an authoritative binding-only boundary.",
      "impact": "Caller-provided values that do not trigger the name/value heuristic are retained in definitions, configuration digests, launch payloads, and durable records. The hardening does not establish the required zero inline-secret acceptance invariant.",
      "evidence": "internal/mcp/types.go:439-447 and :471-480 accept values whenever isSensitiveName and looksLikeSecretValue are false; internal/mcp/import.go:197-220 copies those values into the candidate. internal/mcp/import.go:309-328 is a marker/prefix/length detector, not authoritative non-secret classification. The declared negative regression at internal/mcp/governed_test.go:93-111 exercises only one heuristic-positive value. api-mcp-amendment-decision.md:9 explicitly rejects heuristic secret bypasses and requires approved CredentialBinding handling. This is static evidence; no additional bypass experiment was constructed.",
      "required_fix": "Replace caller-value heuristic classification with the approved authoritative binding-only flow for Header/Environment material. If the product retains non-sensitive literals, their admissibility must be determined by a system-owned constrained schema, not by caller assertions or absence of secret markers. Apply the same rule to import, create, update, persisted validation, and materialization, and extend the declared regressions accordingly."
    },
