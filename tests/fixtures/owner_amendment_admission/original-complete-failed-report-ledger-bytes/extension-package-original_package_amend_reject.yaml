blockers:
- root_cause_key: amendment-authoring-recovery-rebases-protected-budget
  obligation_id: dimension:execution
  classification: new
  owner: amendment-orchestrator
  severity: high
  summary: The proposed mandatory normal AUTHORING recovery cannot currently preserve
    the expressly protected consumed budget.
  impact: Applying through the named normal OMAC path would grant a fresh relative
    Worker/Reviewer allowance to Authorization while keeping its absolute counters
    unchanged. Enforcing the proposal no-grant STOP instead prevents the claimed executable
    repair. A prose safety guard cannot prove a supported budget-preserving apply.
  evidence: Fresh omac work show Authorization 01a10383-b5e2-71ee-bc1e-d5cc5214e55b
    reports worker_bounce=1, review_bounce=1 and no bounce_budget baseline; bound
    meta.amendment_apply has no Authorization retained baseline. Native core/amendment.py:1144-1158
    initializes every existing recovery entry with amendment_bounce_baseline(item);
    :1169-1172 excludes recovered nodes from preserved older baselines; core/stage_recovery.py:283-285
    passes that baseline to restore_authoring_generation. core/retry_budget.py:32-37
    captures absolute counters and :170-215 computes current minus baseline. Thus
    present consumed 1/1 becomes 0/0 after a normal new baseline. Native _minimal_rerun
    independently includes Authorization in AUTHORING. The proposal repeatedly requires
    every current approved budget authority to remain unchanged and refusal of any
    reset/grant. No apply was run; evidence is current CLI facts plus static production
    control-path inspection.
  required_fix: Provide a source-bound, independently reviewable supported recovery
    path that retains the existing absolute/relative budget authority and consumed
    amounts for every affected WorkItem, including Authorization, and prove it without
    live apply or manual runtime edits. If the installed normal path cannot do this,
    retain STOP and obtain a separate explicit lawful budget/recovery decision or
    supported control-plane repair before requesting executable amendment PASS. Do
    not change limits, clear counters, remove required owner obligations, hand-write
    a baseline, or treat this review as granting budget.
