      "root_cause_key": "identity-audit-context-reference-is-external-request-id",
      "obligation_id": "dimension:structure",
      "classification": "new",
      "owner": "identity-local",
      "severity": "medium",
      "summary": "Identity audit events use the external request ID as a persisted RequestContext reference without a context persistence/binding boundary.",
      "impact": "Canonical audit cannot reliably restore the authenticated context, authentication provenance and policy context for identity/locale writes or denials. External request correlation is conflated with the authoritative persisted context identity, so event shape validation and matching request headers do not establish audit traceability.",
      "evidence": "Static evidence on reviewed head: internal/identity/audit.go:14-19 drops the authenticated RequestContext down to three correlation fields; audit.go:83-99 unconditionally sets AuditEvent.RequestContextID to metadata.RequestID. RequestMetadata at types.go:192-197 has no persisted context reference; Tx at types.go:113-134 exposes only AppendAudit(AuditEvent), with no operation receiving/binding the trusted context. ResolveBrowserSession at service.go:444-464 constructs and returns the transient context, without issuing a persisted reference. The HTTP request ID may originate from a caller header (api/auth/local/handler.go:310-321). This conflicts with required security-and-enterprise.md:305-306,317 and contracts/governance/audit/contract.go:1075-1083, which explicitly distinguish the persisted RequestContextID from the external RequestID. Test store AppendAudit at identity_test.go:408-416 only validates/appends the event; locale audit tests count events/denials, not persisted context bindings. All declared tests pass; no additional negative experiment was constructed.",
      "required_fix": "Provide an explicit canonical audit/context persistence boundary in the owned identity port that receives the trusted context and supplies a server-issued persisted reference. Set AuditEvent.RequestContextID to that reference and retain external RequestID in the context record/summary, preserving correlation and causation. Apply this to successful writes, denials and the explicitly supported pre-authentication/installer evidence paths without inventing anonymous administrator contexts. Extend the existing declared tests to prove the event resolves to the correct persisted context and that external RequestID is not substituted for its identity. This is a module port/binding requirement, not a demand for an undeclared downstream live database."
    },
    {
      "root_cause_key": "identity-one-time-proof-audit-fabricates-authorization-policy-provenance",
      "obligation_id": "dimension:ownership",
      "classification": "new",
      "owner": "identity-local",
      "severity": "medium",
      "summary": "One-time proof audits manufacture AuthorizationPolicy and matched-grant provenance instead of recording the controls actually evaluated.",
      "impact": "Bootstrap, invitation acceptance, recovery completion and installer recovery are recorded as Allow decisions under nonexistent policy/grant identities. Audit consumers cannot replay or resolve the reported policy provenance; a token/proof digest is mislabeled as a policy digest. The operations do validate their proofs, but that does not justify synthetic Authorization evidence.",
      "evidence": "Static evidence: internal/identity/audit.go:22-43 constructs a fresh authz.AuthorizationDecision with an identity.one-time.<proof-kind> policy ID, revision 1, the proof digest as PolicyDigest and a hard-coded one-time/valid-<proof-kind> matched grant. It never obtains an AuthorizationDecision from Authorizer or a persisted policy from Governance. authorizationControl at audit.go:59-80 presents those fields as ControlAuthorization provenance. Callers are service.go:220, invitation.go:366 and recovery.go:175,277. Required security-and-enterprise.md:184-201,247-259 requires the single engine/current Scope policy and real immutable policy provenance; docs/design/detailed/10-web-api-cli-detailed-design.md:304 states one Scope has one current policy. The helper creates a parallel fictional policy family solely to satisfy audit validation. AuditEvent.Validate (contracts/governance/audit/contract.go:373-390) requires evaluated controls but does not establish that their policy/grant references exist. No exploit, network probe or new negative test was performed.",
      "required_fix": "Remove the synthesized AuthorizationDecision/policy/grant family. Record truthful evaluated-control evidence from the actual installer authority, bootstrap/current governance policy, invitation authorization and/or authentication receipt as appropriate to each entry point, keeping pre-authentication proof checks distinct from a Scope AuthorizationEngine decision. Do not relabel a token digest as a policy digest or invent a Provider release. If the upstream canonical audit schema cannot represent the required proof control, expose that precise contract-boundary conflict rather than fabricating provenance. Add existing-suite assertions that policy/control identities, revisions, digests and grants resolve to the real evaluated source."
    }
  ],
