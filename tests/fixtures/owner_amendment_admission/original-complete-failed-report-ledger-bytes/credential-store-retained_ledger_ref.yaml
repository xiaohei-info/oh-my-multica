  - blocker_id: BLK-74de0bf0a781
    root_cause_key: credential-use-and-failure-audit-gap
    obligation_id: dimension:evidence
    summary: Materialization outcomes and credential failure paths produce no durable
      AuditEvent.
    evidence: All production AuditEvents insertions are success-only creation/status/rotation/resolve
      writes at internal/credentials/owner.go:196,290,532,651. Materialize/finishMaterialization
      (664-803) update only Materializations and idempotency indexes; consumer failure,
      Store failure and panic cleanup never create an audit event. materializationEvidence
      (internal/credentials/durable.go:133-162) carries no audit witness. Rotate validation
      failures at owner.go:349-353 only release the reservation; Resolve rejection
      branches at 570-604 persist no failure audit. security-and-enterprise.md:491
      explicitly requires audit for every resolution, use, failure, rotation and revocation,
      and detailed design:464-471 includes cleanup plus AuditEvent. Passing panic
      tests prove durable redacted Unknown, not auditable failure.
    required_fix: Persist redacted credential-use/outcome and authorized failure AuditEvents
      with exact Binding, lease/materialization, request and purpose lineage in the
      owner transaction, and provide the canonical audit handoff rather than relying
      only on the private success-event map. Preserve idempotent replay so it does
      not emit duplicate events; keep Secret bytes, provider responses and panic payloads
      out of audit data. Add assertions for successful use, failure, panic/cleanup
      and terminal replay audit behavior.
    status: open
    classification: new
    owner: credential-store
  - blocker_id: BLK-8bf407e188ad
    root_cause_key: credential-materialization-stale-use-window
    obligation_id: dimension:execution
    summary: Materialization can deliver material after the Binding is disabled or
      the lease expires between its two owner transactions.
    evidence: internal/credentials/owner.go:697-748 checks active Binding and lease
      expiry only while committing Pending (726-727), then releases the owner lock.
      The separate Store-read transaction at 753-764 verifies sealed lineage but never
      reloads/checks current Binding status, lease expiry, or that the materialization
      is still Pending. consume runs at 770. UpdateStatus can commit Disabled in the
      gap (248-293); Disabled retains encrypted material. Likewise expiry can occur
      while the second transaction waits. TestCredentialResolveBindsBoundaryAndFailsClosedOnStatusChange
      only tests disable before Materialize starts (owner_test.go:457-463), not this
      gap. This is a static control-flow finding; no additional security experiment
      was constructed.
    required_fix: Make the authoritative eligibility check and material acquisition
      one guarded owner operation at the last safe boundary, verifying current Binding
      status, lease state/expiry and Pending ownership before delivering bytes. Define
      coordination with concurrent lifecycle changes so an already-issued Pending
      marker is not treated as indefinite authority. Preserve legitimate pre-rotation
      lease lineage and immutable terminal replay. Add deterministic interleaving/expiry
      regression tests in the owning package.
    status: open
    classification: new
    owner: credential-store
  - blocker_id: BLK-9e9b43e03248
    root_cause_key: credential-creation-skips-type-safety
    obligation_id: dimension:structure
    summary: CreateBinding marks arbitrary credential types Active without applying
      any type-specific creation rules.
    evidence: internal/credentials/owner.go:63-77 has no TypeMetadata or typed creation
      evidence. CreateBinding at 119-200 checks generic metadata, derives usage/subject,
      encrypts material and writes Active; it never invokes the configured Validator.
      CredentialBindingMetadata.Validate at contracts/governance/credential/wire.go:212-240
      requires only a nonempty CredentialType, and a zero ExpiresAt is accepted by
      CreateBinding at 126. validateMaterial is reached only from Rotate (349). The
      owning design requires type-fixed safety rules (detailed design:439), conditional
      PAT expiry (489), and controlled GitHub App validation/provider-derived scope
      before final creation (487; security reference:512). Generic API-key target
      Probe is expressly different and must not be converted into a universal credential
      test.
    required_fix: Add an explicit supported-type creation path that carries and validates
      required non-sensitive type metadata, enforces conditional expiry, and requires
      controlled type-specific validation/scope evidence where the design requires
      it before committing Active. Reject unsupported types instead of treating arbitrary
      nonempty strings as implemented. Keep generic API-key/MCP validity testing at
      the selected target Probe boundary and retain failure cleanup. This repair belongs
      to credential-store; no downstream evidence or new external artifact is requested.
    status: open
    classification: new
    owner: credential-store
