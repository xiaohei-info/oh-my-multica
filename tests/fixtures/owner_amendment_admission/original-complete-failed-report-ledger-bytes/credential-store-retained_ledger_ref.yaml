      CreateBinding at 126. validateMaterial is reached only from Rotate (349). The
      owning design requires type-fixed safety rules (detailed design:439), conditional
      PAT expiry (489), and controlled GitHub App validation/provider-derived scope
      before final creation (487; security reference:512). Generic API-key target
      Probe is expressly different and must not be converted into a universal credential
      test.
    required_fix: Add an explicit supported-type creation path that carries and validates
      required non-sensitive type metadata, enforces conditional expiry, and requires
      controlled type-specific validation/scope evidence where the design requires
      it before committing Active. Reject unsupported types instead of treating arbitrary
      nonempty strings as implemented. Keep generic API-key/MCP validity testing at
      the selected target Probe boundary and retain failure cleanup. This repair belongs
      to credential-store; no downstream evidence or new external artifact is requested.
    status: fixed
    classification: fixed
    last_evidence: owner.go:1533-1616 rejects unsupported types, checks context/subject,
      enforces PAT expiry/permissions/repository metadata, and requires a controlled
      App CreationValidator with provider-derived subject scope and permissions. API-key
      stays target-Probe based. Creation failure paths wipe copied secret bytes, do
      not persist an Active Binding and persist redacted failures. Independently passing
      owner_review_test.go:32-341 covers these creation branches; residual runtime/rotation
      findings are separately identified new roots, not re-labelled creation defects.
    owner: credential-store
  - blocker_id: BLK-a9b452c2b67e
    root_cause_key: credential-github-app-materialization-missing-type-handler
    obligation_id: dimension:structure
    summary: The newly supported GitHub App profile materializes the stored private
      key, not an on-demand installation token.
    evidence: CreateBinding persists the uploaded material at internal/credentials/owner.go:282-298
      and accepts github-app at 1568-1613. Resolve constructs a generic lease at 867-895,
      with no type-specific materialization descriptor. Materialize directly decrypts
      the stored handle at 1036 and sends those same bytes to consume at 1076. The
      production secretStore at durable.go:221-224,249-261 only encrypts/decrypts;
      Validator/CreationValidator at owner.go:47-65 provide validation, not token
      issuance. No production profile-dispatch or JWT/installation-token exchange
      path appears in the complete five-file PR diff. detailed design:482,487,498
      and security reference:497 require Broker-owned JWT-to-installation-token issuance
      and provider-returned expires_at. Passing creation tests at owner_review_test.go:32-153
      prove validation/scope retention, not this runtime behavior.
    required_fix: Implement a controlled GitHub App type handler inside the Governance
      credential Store/Broker boundary that uses retained type metadata to obtain
      a purpose/subject-scoped installation token and bounds use by the provider expiry.
      Keep App private keys internal to that handler and materialize only the resulting
      short-lived credential to the selected consumer. Fail closed if the handler
      is absent or issuance fails; never delegate token minting to the arbitrary materializer
      callback. Add owning-package runtime profile/expiry/failure tests using controlled
      local fixtures, without requiring an undeclared live environment.
    status: open
    classification: new
    owner: credential-store
  - blocker_id: BLK-c3a9a7b897fb
    root_cause_key: credential-rotation-conditional-expiry-conflicts-with-wire
    obligation_id: dimension:authority
    summary: Supported non-expiring credentials cannot rotate without inventing an
      expiry, and the consumed wire also requires one.
    evidence: internal/credentials/owner.go:1568-1570 accepts github-app only with
      zero ExpiresAt. Rotate at 460-462 and finalizeRotation at 659 reject zero expiry
      for every type; owner.go:683-688 copies that mandatory expiry into the record
      and 704-710 into Binding metadata. The allowlisted credential wire at contracts/governance/credential/wire.go:341-343
      also rejects a rotation record with zero ExpiresAt. In contrast detailed design:427
      says rotation expiry is optional, 489 explicitly states App private keys do
      not expire and requires rotation, and security reference:424,444 makes expiry
      type-dependent. All existing successful rotation fixtures at owner_test.go:122-126
      supply an arbitrary future date for API-key credentials, so the passing gate
      does not exercise this conflict.
    required_fix: Obtain explicit alignment of the consumed rotation wire with the
      authoritative conditional-expiry design, then enforce the resolved type-specific
      expiry rule in the owner and its durable witnesses. Do not fabricate App-key
      expiry merely to satisfy wire validation or silently edit upstream contracts
      in this implementation. Add a non-expiring-key rotation case and an expiring-PAT
      case against the aligned wire. Retain the existing CAS, idempotency and audit
      gates.
    status: open
    classification: new
    owner: credential-store
