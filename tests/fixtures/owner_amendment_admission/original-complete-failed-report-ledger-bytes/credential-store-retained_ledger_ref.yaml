  - blocker_id: BLK-74de0bf0a781
    root_cause_key: credential-use-and-failure-audit-gap
    obligation_id: dimension:evidence
    summary: Durable use/outcome handoffs were added, but authorized rotation failures
      still bypass audit and some resolution failures lose purpose/target lineage.
    evidence: internal/credentials/owner.go:465-488 validates the rotation authorization,
      then returns replay conflicts or a stale-CAS error without recordCredentialFailure/failRotation;
      rotationReplay at 523-537 is read-only. The existing stale-CAS case at owner_test.go:501-504
      asserts only the returned error. Resolve at owner.go:815-825 sends authorized
      target/usage/subject failures through recordCredentialFailure; that helper at
      1425-1435 persists Purpose=action and an empty boundary rather than the attempted
      request. In contrast, success/use witnesses and terminal replay deduplication
      are now implemented at 1142-1183 and independently passing owner_test.go:275-365.
      security-and-enterprise.md:491 requires audit for every resolution/use/failure/rotation/revocation.
      This is a static branch/lineage finding; no additional negative experiment was
      constructed.
    required_fix: Route all post-authorization rotation failure exits, including stale
      CAS and conflicting replay, through the durable redacted failure handoff. Preserve
      attempted resolve Usage, Subject and selected MaterializationBoundary in authorized
      failure lineage instead of replacing them with the action name and an empty
      boundary. Keep successful terminal replay audit deduplication. Add owning-package
      audit assertions for these existing rejection paths.
    status: open
    classification: deeper
    owner: credential-store
    last_evidence: internal/credentials/owner.go:465-488 validates the rotation authorization,
      then returns replay conflicts or a stale-CAS error without recordCredentialFailure/failRotation;
      rotationReplay at 523-537 is read-only. The existing stale-CAS case at owner_test.go:501-504
      asserts only the returned error. Resolve at owner.go:815-825 sends authorized
      target/usage/subject failures through recordCredentialFailure; that helper at
      1425-1435 persists Purpose=action and an empty boundary rather than the attempted
      request. In contrast, success/use witnesses and terminal replay deduplication
      are now implemented at 1142-1183 and independently passing owner_test.go:275-365.
      security-and-enterprise.md:491 requires audit for every resolution/use/failure/rotation/revocation.
      This is a static branch/lineage finding; no additional negative experiment was
      constructed.
  - blocker_id: BLK-8bf407e188ad
    root_cause_key: credential-materialization-stale-use-window
    obligation_id: dimension:execution
    summary: Eligibility is rechecked around Store read, but not after persisting
      the delivery marker and before invoking the consumer.
    evidence: internal/credentials/owner.go:1046 performs the last materializationEligible
      check; 1057-1066 marks delivery started. withState then validates state and
      performs the fsync/rename/directory-sync commit at durable.go:315-325,350-386
      before returning. owner.go:1068-1076 invokes consume based solely on acquired,
      without a post-commit eligibility or terminal-state check. pendingMaterializationActive
      at 1128-1139 stops guarding lifecycle changes when the lease or two-minute delivery
      window expires; UpdateStatus at 373-393 can then terminalize Unknown and change
      status even though this original call has not reached consume. New tests at
      owner_review_test.go:343-475 cover expiry before acquisition and during Store
      read, not the commit-to-consumer interval. detailed design:418,505 requires
      current eligibility and fail-closed expiry. This is a static control-flow finding,
      not an added interleaving/security experiment.
    required_fix: Coordinate the durable delivery-start commit, final eligibility/terminal-state
      check, and actual consumer admission as one owner-controlled handoff. A marker
      that expires or becomes terminal while persistence/scheduling completes must
      not authorize subsequent byte delivery. Define lifecycle coordination at that
      final boundary without extending the lease; wipe acquired material and retain
      the authenticated redacted Unknown/audit outcome when admission is lost. Add
      a deterministic slow-commit/expired-marker regression test while preserving
      valid pre-rotation leases and immutable replay.
    status: open
    classification: deeper
    owner: credential-store
    last_evidence: internal/credentials/owner.go:1046 performs the last materializationEligible
      check; 1057-1066 marks delivery started. withState then validates state and
      performs the fsync/rename/directory-sync commit at durable.go:315-325,350-386
      before returning. owner.go:1068-1076 invokes consume based solely on acquired,
      without a post-commit eligibility or terminal-state check. pendingMaterializationActive
      at 1128-1139 stops guarding lifecycle changes when the lease or two-minute delivery
      window expires; UpdateStatus at 373-393 can then terminalize Unknown and change
      status even though this original call has not reached consume. New tests at
      owner_review_test.go:343-475 cover expiry before acquisition and during Store
      read, not the commit-to-consumer interval. detailed design:418,505 requires
      current eligibility and fail-closed expiry. This is a static control-flow finding,
      not an added interleaving/security experiment.
