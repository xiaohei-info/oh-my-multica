  - blocker_id: BLK-62858e200019
    root_cause_key: identity-recovery-session-issuance-not-serialized
    obligation_id: dimension:structure
    summary: Session issuance is not fenced against concurrent password recovery.
    evidence: 'Static control-flow evidence: internal/identity/service.go:362-370
      authenticates outside the session-write transaction; createSession at service.go:294-355
      resolves identity and access before a transaction containing only CreateSession
      and AppendAudit. internal/identity/recovery.go:247-255 replaces the credential
      and revokes currently stored sessions in a separate transaction. SessionRecord/Tx
      at types.go:81-86,125-127 carry no credential generation or conditional issuance
      fence. TestRecoveryIssueCompletionRevokesSessionsAndIsIdempotent and TestUJIdentity001BootstrapInvitationLocaleRecoveryAndSessionLifecycle
      exercise already-persisted sessions sequentially; they do not cover in-flight
      authentication. This finding is based on code inspection, not an additional
      security experiment.'
    required_fix: Serialize local credential validation/session issuance with recovery,
      or bind the verified authentication to a credential/session generation checked
      atomically at session creation and session resolution. Apply the same boundary
      to login and bootstrap/invitation auto-login. Add a deterministic local regression
      proving recovery invalidates pre-recovery authentication even when session persistence
      completes later, without retaining plaintext credentials.
    status: open
    classification: new
    owner: identity-local
  - blocker_id: BLK-7e002b74f69c
    root_cause_key: identity-concurrent-idempotency-omits-password-equivalence
    obligation_id: dimension:structure
    summary: Concurrent replay branches skip the password-equivalence checks used
      for ordinary idempotent retries.
    evidence: 'Static evidence: recovery.go:195 hashes only the token digest; completedRecoveryReplay
      at 271-311 verifies password equivalence, but the transaction replay branch
      at 228-232 directly unmarshals the saved result. service.go:128-130 omits password
      from the bootstrap digest and 177-183 skips bootstrapReplay verification when
      the record appears between the initial lookup and transaction. invitation.go:308
      similarly omits password and 326-330 skips acceptedInvitationReplay verification.
      Existing concurrent tests use different idempotency keys; ordinary replay tests
      validate sequential changed-input rejection, not this race. No additional negative-test
      input was constructed.'
    required_fix: Make password-equivalence validation part of every idempotency replay
      decision, including the atomic transaction branch, using the same protected
      comparison semantics as the ordinary replay path. Do not store plaintext or
      an unkeyed low-entropy request-password digest. Add deterministic concurrent
      same-key tests for identical input and changed input across bootstrap, invitation
      acceptance, and recovery; changed input must return a conflict rather than success.
    status: open
    classification: new
    owner: identity-local
  - blocker_id: BLK-8646e42ba221
    root_cause_key: identity-dependency-errors-mapped-to-user-denials
    obligation_id: dimension:execution
    summary: Authentication and governance dependency failures are flattened into
      credential or permission errors.
    evidence: service.go:366-368 turns every LocalAuthenticator.Authenticate error
      into ErrInvalidCredentials; service.go:435-437 and invitation.go:467-469 turn
      Policy lookup errors into ErrForbidden; recovery.go:217-219 turns LocalScopeID
      errors into ErrNotFound. bootstrapReplay service.go:268-270, acceptedInvitationReplay
      invitation.go:415-417, and completedRecoveryReplay recovery.go:308-310 also
      flatten VerifyPassword operational errors into idempotency conflicts. The independently
      executed declared suite includes TestSessionAndAuthorizationFailureMatrix (failure_paths_test.go:194-275),
      which injects an operational driver failure at identity_test.go:485-487 and
      currently asserts ErrInvalidCredentials at failure_paths_test.go:248-251. handler.go:337-353
      already supports sanitized 500 responses, and its handler-only internal-error
      test does not exercise this Service path.
    required_fix: Distinguish known invalid-credential/authorization/not-found outcomes
      from operational errors through typed port/SDK errors. Preserve or wrap operational
      errors at the service boundary and return sanitized 5xx responses at HTTP boundaries.
      Update the declared failure tests to assert propagation for outages/cancellation
      and user-facing denial only for genuine credential or permission failures. Retain
      the intentionally designed post-commit login and notification fallbacks.
    status: open
    classification: new
    owner: identity-local
  - blocker_id: BLK-8c9128c2b72c
    root_cause_key: identity-request-metadata-regenerated-within-http-request
    obligation_id: dimension:evidence
    summary: Protected HTTP mutations regenerate request identity instead of propagating
      the resolved request metadata.
    evidence: handler.go:267 obtains requestMetadata for ResolveBrowserSession and
      273 exposes that RequestID; protected route callbacks invoke requestMetadata(r)
      again (e.g. 204 and 252). requestMetadata at 292-303 generates a new random
      RequestID each call and does not attach it to the request. locale.go:54-56 and
      recovery.go:40-42 overwrite the RequestContext IDs with the second metadata.
      The shared governance reference security-and-enterprise.md:13-15 requires request
      identity propagation and causal tracing. Handler tests use testApplication,
      returning a fixed context at handler_test.go:119-124, and do not assert identity
      equality between resolution, authorization, audit, and response. Static code
      inspection establishes this discrepancy; no new request experiment was run.
    required_fix: Normalize metadata exactly once at the HTTP entry and pass the same
      immutable metadata through session resolution and the application call. Preserve
      the resolved RequestContext request/causation/correlation IDs instead of overwriting
      them with independently generated ones. Add handler-to-service regression assertions
      for absent and supplied request IDs across locale, recovery, invitation, and
      logout paths.
    status: open
    classification: new
    owner: identity-local
