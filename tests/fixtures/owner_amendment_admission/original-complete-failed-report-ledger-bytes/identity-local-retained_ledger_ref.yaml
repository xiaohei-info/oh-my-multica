  - blocker_id: BLK-9a7d286279b9
    root_cause_key: identity-breakglass-concurrent-replay-returns-unpersisted-token
    obligation_id: dimension:structure
    summary: Concurrent break-glass recovery replay can return a successful response
      with a recovery link that was never persisted.
    evidence: 'Static evidence: internal/identity/recovery.go:134-145 performs an
      initial replay read, then allocates a fresh challenge identity and token. If
      another identical request commits before this call enters Transact, lines 148-151
      load the prior result and return from the callback without storing this call''s
      challenge/token digest. After that successful transaction, line 178 unconditionally
      attaches this call''s fresh token to the replayed result. Ordinary recovery
      issue at recovery.go:102-104, invitation create at invitation.go:112-114, and
      reissue at invitation.go:205-207 already guard this exact branch by comparing
      the committed result identity. TestRecoveryAuthorizationScopeAndBreakGlassReplayFailures
      at failure_paths_test.go:910-917 only checks sequential replay, so the declared
      passing suite does not rule this out. This finding is based solely on code inspection,
      not a new security experiment.'
    required_fix: Track whether this call actually committed the newly generated break-glass
      challenge and only expose its one-time link on that branch. Return the persisted
      token-free result on concurrent replay, consistently with ordinary recovery/invitation
      issuance, without storing plaintext tokens. Add a deterministic concurrent same-key
      regression to the existing declared suite proving that every emitted link corresponds
      to a committed challenge, only one challenge/audit is created, and replay emits
      no new link.
    status: open
    classification: new
    owner: identity-local
