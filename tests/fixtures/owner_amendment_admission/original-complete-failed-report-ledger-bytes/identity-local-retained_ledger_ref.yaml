    required_fix: Preserve or wrap operational/cancellation errors from both InstallerAuthority
      calls; map only an explicitly typed/sentinel authorization denial to ErrForbidden.
      Keep missing/invalid proof fail-closed and retain the intentional post-commit
      session and notification fallbacks. Add coverage in the existing declared suite
      for actual denial versus operational failure and cancellation for both installer
      entry points.
    status: fixed
    classification: fixed
    last_evidence: service.go:93-97 and recovery.go:122-130 map only errors.Is(ErrForbidden)
      to denial, wrap all other installer errors and reject missing proof. The independently
      executed TestBootstrapInstallerAndPersistenceFailureMatrix and TestRecoveryAuthorizationScopeAndBreakGlassReplayFailures
      include operational error and cancellation cases and distinguish them from actual
      denial. Existing credential/governance error propagation and intentional post-commit
      fallbacks remain intact.
    owner: identity-local
  - blocker_id: BLK-9a7d286279b9
    root_cause_key: identity-breakglass-concurrent-replay-returns-unpersisted-token
    obligation_id: dimension:structure
