      issuance, without storing plaintext tokens. Add a deterministic concurrent same-key
      regression to the existing declared suite proving that every emitted link corresponds
      to a committed challenge, only one challenge/audit is created, and replay emits
      no new link.
    status: fixed
    classification: fixed
    last_evidence: recovery.go:154-193 resets a created flag for each transaction
      callback, sets it only after challenge/audit/idempotency persistence succeeds,
      and attaches the token URL only for created=true. Concurrent replay returns
      the persisted token-free summary. TestConcurrentBreakGlassReplayOnlyReturnsPersistedToken
      at failure_paths_test.go:959-1025 uses a deterministic ID barrier, asserts one
