    obligation_id: dimension:evidence
    summary: Fresh repair evidence and verification are bound to the source-parent
      commit rather than the submitted final PR HEAD.
    evidence: 'PR90 HEAD and delivery_identity: 1ebf12d36d29c2a3726257bd03685139f5bc568a.
      Published artifacts/harness-sdk-build-repair-evidence/{semantic-evidence.json,component-manifest.json,source-snapshot.json,verification-results.json,evidence-index.json}
      identify 96020d5faf6d4bbb399c068da50d1885fa9dcb5a. owner-repair.md:18-23 and
      44-46 explicitly document the parent-commit execution/evidence strategy. In
      an isolated submitted-HEAD checkout with the delivered repair payloads placed
      at the inherited gate paths, exact commands 16 and 20 both exit 1 at source_revision==git
      rev-parse HEAD. Separately regenerating the outputs at HEAD makes all 23 unchanged
      commands pass.'
    required_fix: Preserve PR90 and its one-line SDK diff. At the stable final submitted
      PR HEAD rerun all 23 commands in the original order/environment, regenerate
      every required SDK/repair artifact with that exact source_revision, and publish
      a new immutable source-bound evidence set plus fresh OMAC verification identifying
      the same HEAD. Use external immutable publication/attachments if needed to avoid
      an artifact-only commit advancing HEAD after generation; do not relabel old
      outputs, weaken equality gates, overwrite historical deliveries, create a duplicate
      PR, or change SDK behavior.
    status: open
    classification: new
    owner: harness-sdk
