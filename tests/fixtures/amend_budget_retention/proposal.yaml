      Exact package/API decision (new names are required deliverables):

      1. internal/audit remains the application owner: append/query/detail/export use cases, RequestContext/Authorization
      sequencing, typed repository ports, transactional/idempotent commit and evidence assembly. Define
      a narrow detail-load port returning audit.AuditEventStoreBinding from exact authorized scope/project/event
      selectors. Never accept a client-selected event or authority. Keep public product QueryAuditEvents/GetAuditEventDetail/ExportAuditEvents
      unchanged.

      2. internal/audit/platformstore is trusted composition/infrastructure only. Add an opaque Handle
      with private fields and a root-internal factory binding the one platform PostgreSQL *sql.DB; reject
      nil and zero handles. It carries only the platform connection, not caller event bytes/receipts/callbacks.
      Only trusted composition code can construct it. Its internal import boundary prevents an external
      Go consumer from manufacturing the argument; never return the Handle or a factory through public
      audit/API entrypoints. Restrict any handle accessor to this internal package boundary; never expose
      it through a contract DTO.

      3. Add contracts/governance/audit/store, a distinct outer-adapter Go package, not code in package
      audit. Its NewPostgresStore takes only the opaque platformstore.Handle (not *sql.DB, a DSN, an interface/callback,
      payload, receipt or event), validates the handle and returns the built-in concrete adapter/error.
      That package may legally import contracts/governance/audit/internal/auditstore. Its LoadDetailBinding
      uses fixed parameterized SQL and exact authorized scope/project/event keys to read the canonical
      committed row, verifies requested identity/scope/project, immutable record fields and stored canonical
      content digest, validates the event, snapshots canonical bytes, calls internal auditstore.NewReceipt,
      then audit.NewAuditEventStoreCapability and audit.LoadAuditEventStoreBinding. Receipt pointers never
      leave this adapter; the application receives only the existing opaque binding, calls NewAuditEventDetailViewFromStore,
      fills authorized/redacted related evidence and validates before serialization. Query handlers cannot
      choose a database, schema, table or authority. The concrete adapter also implements the canonical
      append/query storage ports over that same table; no second storage path. Receipt issuance uses a
      committed read, never a transaction''s pending append argument, caller-supplied serialization, cache
      or mock.

      4. api/audit owns composition wiring of the trusted platform handle, concrete adapter and application
      ports. Framework/database types stay out of contract/domain/application interfaces. The root-internal
      handle is the minimum guarded wiring needed to keep the public adapter from becoming a new self-signing
      authority API. Existing contracts/governance/audit/contract.go and internal/auditstore/receipt.go
      remain byte-for-byte unchanged. New adapter tests live in its own subtree and application tests
      under existing audit scope.


