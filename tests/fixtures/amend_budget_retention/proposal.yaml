        '\"'path'\"'\"'] for f in files})==len(files)\nrequired=set(json.loads(sys.argv[4])); assert required\
        \ <= {f['\"'\"'path'\"'\"'] for f in files}, sorted(required-{f['\"'\"'path'\"'\"'] for f in files})\n\
        for f in files:\n assert re.fullmatch(r'\"'\"'https://raw.githubusercontent.com/xiaohei-info/open-agent-cluster/[0-9a-f]{40}/[^?#]+'\"\
        '\"',f['\"'\"'url'\"'\"'])\n assert f['\"'\"'url'\"'\"'].split('\"'\"'/'\"'\"',6)[6]==f['\"'\"\
        'path'\"'\"'] and '\"'\"'..'\"'\"' not in Path(f['\"'\"'path'\"'\"']).parts\n assert type(f['\"\
        '\"'bytes'\"'\"']) is int and f['\"'\"'bytes'\"'\"']>0 and re.fullmatch('\"'\"'[0-9a-f]{64}'\"\
        '\"',f['\"'\"'sha256'\"'\"'])\n with urllib.request.urlopen(f['\"'\"'url'\"'\"'],timeout=60) as\
        \ response:\n  assert response.geturl()==f['\"'\"'url'\"'\"']; b=response.read()\n assert len(b)==f['\"\
        '\"'bytes'\"'\"'] and hashlib.sha256(b).hexdigest()==f['\"'\"'sha256'\"'\"']\n assert hashlib.sha1(b'\"\
        '\"'blob '\"'\"'+str(len(b)).encode()+b'\"'\"'\\0'\"'\"'+b).hexdigest()==f['\"'\"'blob_oid'\"\
        '\"']\n assert Path(f['\"'\"'path'\"'\"']).read_bytes()==b\nprint('\"'\"'immutable producer bytes\
        \ and exact source HEAD verified'\"'\"')\n' artifacts/authorization/owner-command/evidence-index.json\
        \ authorization authorization-owner-command-evidence '[\"artifacts/authorization/bundle-digest.txt\"\
        , \"artifacts/authorization/component-manifest.json\", \"artifacts/authorization/coverage.out\"\
        , \"artifacts/authorization/owner-command/bundle-digest.txt\", \"artifacts/authorization/owner-command/component-manifest.json\"\
        , \"artifacts/authorization/owner-command/production-composition-and-ownership.json\", \"artifacts/authorization/owner-command/source-bundle.tar.zst\"\
        , \"artifacts/authorization/owner-command/tests.json\", \"artifacts/authorization/source-bundle.tar.zst\"\
        ]'"
