      - python3 scripts/release/verify_component_manifest.py --manifest artifacts/authorization/owner-command/component-manifest.json
        --bundle artifacts/authorization/owner-command/source-bundle.tar.zst
      - "python3 -c 'import hashlib,json,re,subprocess,sys,urllib.request\nfrom pathlib import Path\n\
        p=Path(sys.argv[1]); producer=sys.argv[2]; artifact_id=sys.argv[3]\nr=json.loads(p.read_text());\
        \ assert r['\"'\"'schema'\"'\"']=='\"'\"'oac.owner-publication/v1'\"'\"'; assert r['\"'\"'producer'\"\
        '\"']==producer and r['\"'\"'artifact_id'\"'\"']==artifact_id\nassert re.fullmatch('\"'\"'[0-9a-f]{40}'\"\
