        '\"'git'\"'\"','\"'\"'rev-parse'\"'\"','\"'\"'HEAD'\"'\"'],text=True).strip()\nassert r['\"'\"\
        'product_tree'\"'\"']==subprocess.check_output(['\"'\"'git'\"'\"','\"'\"'rev-parse'\"'\"','\"\
