      - Do not bypass authorization, admission, CAS, idempotency, review, or evidence gates.
      - Do not preserve unpublished prototype behavior unless the owning design explicitly requires it.
      - Do not redefine or replace contracts-extension-wire, RequestContext, Project, Solution, Authorization,
        Admission, or Audit records, engines, identities, revisions, or digests inside Package Governance.
