reason: 'Source-bound producer-responsibility repair under delegation9512, using the exact bound manifest
  SHA256 87111694c7412fa66490a68151249b8052330933eae686dfb509cd77adca5f72 (183 nodes, 68 done) and the
  eight supplied owning design/reference/acceptance documents. The remote manifest-runtime checkout is
  older and is not substituted for this bound authority. Fresh work-show contracts for authorization,
  audit-ledger and extension-package equal the bound contracts. Current Package is todo/authoring with
  absolute0/4/0 after planning admission, not an ordinary dispatch authorization; retain the genuine earlier
  owner-decision and source history.


  Exactly three definition updates are necessary: Authorization must own the actual canonical production
  proof command and its immutable typed publication; AuditLedger already owns receipt967''s concrete committed-record
  boundary but must publish its typed source/conformance identity; Package must depend on those real producers
  and permit their exact typed outputs. No workers/scope roots/release-component ownership or acceptance
  responsibilities migrate. All original contract fields, commands, metrics, sources and non-goals are
  preserved unless explicitly augmented here; owners'' omitted consumes remain omitted and Package''s
  prior strict Wire consume remains unchanged. No new nodes, broad plan rewrite, removal, empty resume,
  runtime patch, completed-node edit or claim of technical PASS.


  Scope of the result is a partial producer/topology/publication repair, NOT complete Package unblocking.
  The independent amendment Reviewer must explicitly judge this narrower repair with the unresolved
  Wire STOP intact; if complete unblocking is required for acceptance, reject rather than infer a waiver.
  Read-only local validation uses the native OMAC proposal validator and authoritative acceptance file:
  no schema/lint errors, no done-descendant conflict, all 68 done full objects and 180 unaffected full
  node objects preserved, original commands/gates/metrics/sources and all acceptance fields unchanged.
  Both original and disposable amended 183-node manifests pass omac dag check --no-review; shell syntax
  and inline Python compilation pass for all 41 resulting verification commands. These are structural
  checks only: no product tests, producer publication, live apply, dispatch or technical verdict occurred.


  Wire evidence is NOT recovered: the exact-label OMAC work read on Package (source: 前置开发任务 · Publish
  Package, Harness and ComponentRun wire contracts) still exits 5 because upstream issue01a032bd-188a-7c88-b4b8-06e682c7b907
  has no readable deliverable. Its declared verification fae4c939574eb4f2e4906f62a3b121aed784d12c237ee758af9f00d3ab443fa2
  and report64b2b095ba07cb7512587277a19169481fb30e1e5e512f53b4cd748df9147956/ledger7ba3b143d7d7d2c3950d65d90ae12d9305935f2839f4b2f2fc0ab8369fd2c9ce
  are metadata/evidence references, not the three declared artifact payloads. Complete GitHub tree at
  the sealed PR59 head d4453dc96fa0e0d84b9b4484127ee6f396988fce has none of artifacts/contracts-extension-wire/{coverage.out,wire-contract-tests.json,evidence.json};
  the issue attachment scan has no physical Wire payload, Actions artifact total_count is 0 and visible
  releases are Preview-only. These reads prove non-retrieval from checked locations, not global nonexistence.


  Keep contracts-extension-wire-evidence with the same completed producer and strict artifact policy.
  Do not approve merged source as the input, manufacture missing hashes, generate a replacement and label
  it historical, remove the consume, reopen the completed producer, or modify other consumers. Package
  remains FAIL-CLOSED on this prerequisite. Before any Package Worker dispatch the single coordinator
  must retrieve the original declared bytes from a real retained producer publication, prove their linkage
  to the sealed delivery and exact source, publish/refer to immutable retrievable bytes without changing
  the old producer facts, and have independent review verify evidence.json digests plus all four named
  passing test events and coverage90. If that cannot be proved, STOP with the missing-artifact blocker;
  this amendment grants no substitute-input or unchanged-scope retry. A genuinely necessary new production/evidence
  repair would require its own source-bound independent amendment, not an implicit operation or fake success
  here.


  Retain PR70/head304a6e and full verification7470bbac4ef8a10cbbacfbf38ce9121af7f75d163e6bfb060ae4c82a99feddd3
  plus ledgerc6280c80c697810292c6208e42b9b0ec2ce9a26c3de562112630acc090136812, every cycle/root cause/test/control
  and fixed/open classification, and the original owner-decision-required v2 from direct Run01a1039e-745d-72a2-a1e7-1929d5911c01.
  Preserve the clean unpushed Package merge HEAD1b0e9796048e394b2c5aa91db88b85a9468b282c as source history,
  never overwrite/push it as a planning side effect. Absolute Package counters remain worker/review/merge=0/4/0
  and all configured/current approved budget authority remains unchanged. This proposal closes no product
  blocker by itself.


  Recovery classification is AUTHORING, not review or merging: implementation/input/publication obligations
  changed and there is no adequate reviewed production delivery for them. No duplicate resume operation
  is added. Native downstream classification must be exposed, not suppressed: authentication-methods,
  direct-deployment, contracts-extension and solution-publishing are already-started descendants that
  require AUTHORING validation against the changed upstream input; their complete contracts, workers/scopes,
  prior rejects, evidence and budget authority remain unchanged. Unstarted descendants keep their runtime
  state. No ordinary Package dispatch is authorized by proposal submission or planning admission. The
  single Root controller may accept only after fresh independent complete PASS and current base/CAS, minimal/stage,
  related-terminal-Run, done-object and budget guards; refuse while any affected/related Run is active/unknown,
  any producer/source has drifted, or any apply would erase reject evidence or reset/grant budget. Do
  not cancel healthy owner work, run a parallel controller, hand-write runtime fields, reopen done nodes,
  or apply this file directly.'
operations:
- op: update
  node: authorization
  set:
    description: 'Keep the existing authorization issue/Worker, Policy CRUD/candidate/adoption implementation,
      canonical authz contracts, ownership and main PR. The current PR98 at 37b9d6f08fd116a07ea8e29d827d4a0d3574bb9d
      is OPEN and independently rejected, not a merged production issuer. Preserve full report c9def33ac947ba2b5e72d6e986022e708914d9d57f40150d121b4e63a6a336c0,
      ledger c6d5cfbc200c2f85066090e9b41a0298c4c551f1626f0afd6fa420180e5fba19, both original root causes
      (verified AuthenticationContext strength; exception-to-Deny) and ordinary rejected-head rework rules.
      This is additional owner implementation/publication responsibility, not a verdict or a retry of
      unchanged Package scope.


      Deliver a narrow production owner command over the existing Engine.Authorize and published authz.AuthorizationRequest/AuthorizationDecision.
      The command is created only by trusted Platform Core composition with its authoritative current
      Scope policy, local identity/access/subject resolution and verified RequestContext; product request
      callers and Package composition cannot select a PolicyStore, resolver, decision, signer/verifier,
      descriptor or trust root. It must call the one built-in engine for each governed request and return
      its exact canonical decision/provenance, not sign or approve a supplied decision/digest. Bind exact
      principal/scope/project, action, typed subject ID/digest, canonical request and current policy ID/revision/digest.
      Package release/install, operation and lifecycle CAS/idempotency binding are carried through the
      owning application command; Authorization must not import internal/extensions or own Package/Project/Solution/Admission/Audit
      state.


      Use an owner-authenticated command/result rather than another public grant constructor. Return
      the complete canonical evaluated request/decision provenance to the governed application command;
      the downstream Package composition and Audit owner, not Authorization, persist and reload that
      exact historical proof through the existing canonical transaction/store boundary. No JSON-decoded
      private seal or caller-computed digest becomes authority. Re-evaluate current authorization separately
      on a replay; a new decision
      ID/EvaluatedAt must not change the stable logical Package request identity or rewrite its original
      committed proof. Do not create a second mutable decision store, receipt registry, proof service,
      signer selection API or local Package authorization engine. If an owner resource needed by real
      composition is unavailable, fail closed; ports returning structural values or fixtures alone are
      not completion. Audit implementation and the eventual Package transaction/composition remain their
      owners'' duties, so no dependency from Authorization back to Package or a redundant audit implementation
      is introduced.


      The NEW named owner-command tests below are implementation deliverables under internal/authorization,
      not existing-test claims. They must exercise only exported production composition with real canonical
      owner-backed fixture storage/resolvers, never a caller-selected permissive engine. Cover canonical-engine
      allow and deny, authentication provenance and both original review failures, exact request/subject/policy
      and resource substitution, unknown/stale owner revision, denied/error/cancelled paths with no protected
      mutation, reload of the canonical current policy after owner restart, and current-policy reauthorization
      with stable logical replay identity. The Authorization restart test proves its own real policy/command
      boundary only; the original Package external tests and Audit receipt967 tests still prove the full
      committed-proof round trip. Do not import or require downstream Package/Audit implementation to
      make this upstream command independently testable. A fixture may seed the authoritative stores via their normal
      trusted setup; it may not substitute fake owner ports/keys for the production command. Source audit
      records the actual production constructor and call graph, exact imported owners and any supporting
      files, proves no import of extensions/no duplicate authorization evaluator/no caller decision or
      trust injection, and accounts for every changed source under the unchanged authorization component.


      Typed output authorization-owner-command-evidence is a reviewed immutable source/API/conformance
      publication, not a reusable authorization capability. Its runtime command must still evaluate the
      actual caller and policy. Add evidence_mode artifact and produces only; consumes remains OMITTED
      (unchanged transitional legacy upstream policy), not [] or null.


      Publish the complete declared artifacts and raw command/test receipts from the actual committed
      product PR HEAD at immutable full-commit GitHub blob/raw URLs in xiaohei-info/open-agent-cluster.
      An evidence commit may be separate from the product commit to avoid circular self-hashing. The evidence
      index must bind product PR URL, full product HEAD/tree, producer node, typed artifact ID, each payload
      repository path, full-commit raw URL, Git blob OID, SHA256 and byte size; retain the original verification/reject/blocker
      references. Include the exact source bundle/component-manifest, coverage, all required native JSON
      test events, production composition/source-ownership map, concrete dependency/fixture versions and
      executed argv/exit results. Reference the immutable index URL and every payload in formal verification
      retrievable_artifacts. Reviewer must freshly retrieve actual bytes, independently verify Git/source
      identity and reproduce the required gates before ordinary merge. An index or local file alone, mutable
      PR/branch/release URL, declared count, structural DTO, fixture result or merged contracts PR is
      not a production owner proof. Do not include private keys, credentials, live request secrets or
      unredacted sensitive data. Local conformance uses only an isolated owned fixture with real production
      implementation and explicit setup/teardown, not a live environment grant.


      Recovery classification is AUTHORING, not review or merging: implementation/input/publication obligations
      changed and there is no adequate reviewed production delivery for them. No duplicate resume operation
      is added. Native downstream classification must be exposed, not suppressed: authentication-methods,
      direct-deployment, contracts-extension and solution-publishing are already-started descendants that
      require AUTHORING validation against the changed upstream input; their complete contracts, workers/scopes,
      prior rejects, evidence and budget authority remain unchanged. Unstarted descendants keep their
      runtime state. No ordinary Package dispatch is authorized by proposal submission or planning admission.
      The single Root controller may accept only after fresh independent complete PASS and current base/CAS,
      minimal/stage, related-terminal-Run, done-object and budget guards; refuse while any affected/related
      Run is active/unknown, any producer/source has drifted, or any apply would erase reject evidence
      or reset/grant budget. Do not cancel healthy owner work, run a parallel controller, hand-write runtime
      fields, reopen done nodes, or apply this file directly.'
    contract:
      objective: Deliver policy CRUD/evaluation and one explainable decision path reused by every adapter.
        Also deliver and independently prove a production owner-authenticated command over that same engine,
        with exact canonical request/policy provenance consumable by Package Governance and immutable
        source-bound publication; no caller-issued decisions or alternate authorization authority.
      non_goals:
      - Do not change adjacent domain ownership or introduce a competing source of truth.
      - Do not bypass authorization, admission, CAS, idempotency, review or evidence gates.
      - Do not preserve unpublished prototype behavior unless the owning design explicitly requires it.
      - Do not retire or reinterpret the PR98 independent reject root causes authorization-authentication-strength-not-bound-to-verified-context
        and authorization-internal-exceptions-escape-decision-boundary, its full report/ledger, original
        gate, coverage floor or ordinary same-HEAD rework guard.
      - Do not accept a public caller-selected PolicyStore, resolver, RequestContext authority, AuthorizationDecision,
        digest, signer/verifier or trust descriptor as production proof. An internal dependency-injection
        seam is not a production authorization issuer; the one real engine and trusted composition must
        be exercised.
      - Do not import Package Governance/SDK, duplicate Project/Solution/Admission/Audit decisions, mint
        Audit receipts, create another mutable decision/receipt truth store, change published authz or
        identity wire types, or reopen completed contracts nodes.
      - Do not equate published test artifacts with runtime capabilities. Serialized canonical decisions
        are evidence only; current authorization requires owner evaluation and historical proof requires
        the committed owner record. No generated test key or permissive test adapter is a production issuer.
      - Do not claim this amendment, PR98 author publication, an old merged contract, or fixture execution
        is independent production PASS or full UJ acceptance. Keep all acceptance responsibilities unchanged.
      - The new delivery index is oac.owner-publication/v1 with producer, artifact_id, product_pr, product_head,
        product_tree and files[].{path,url,blob_oid,sha256,bytes}; SHA256 is bare lowercase hex, URLs
        are full-commit raw GitHub URLs. Do not include the index in its own files list. Publish its own
        immutable URL separately in formal verification, with its independently checked hash/size. This
        delivery-only schema neither changes public domain DTOs nor grants runtime authority.
      verification_commands:
      - mkdir -p artifacts/authorization && go test -covermode=atomic -coverprofile=artifacts/authorization/coverage.out
        ./internal/authorization/...
      - python3 -c "from pathlib import Path; import re,subprocess; p=Path('artifacts/authorization/coverage.out');
        assert p.is_file() and p.stat().st_size>0; out=subprocess.check_output(['go','tool','cover','-func='+str(p)],text=True);
        m=re.search(r'^total:\s+\(statements\)\s+([0-9.]+)%$',out,re.M); assert m and float(m.group(1))
        >= 90"
      - python3 scripts/release/package_component.py --component authorization --kind platform-core-dependency-source
        --input internal/authorization --bundle artifacts/authorization/source-bundle.tar.zst --component-manifest
        artifacts/authorization/component-manifest.json --digest-output artifacts/authorization/bundle-digest.txt
        --ownership-baseline contracts/release/source-ownership-baseline.yaml --owner authorization --require-all-owner-sources-accounted
      - mkdir -p artifacts/authorization/owner-command
      - go test -count=1 -json ./internal/authorization/... -run '^(TestAuthorizationOwnerCommandUsesCanonicalEngine|TestAuthorizationOwnerCommandRejectsCallerAuthority|TestAuthorizationOwnerCommandBindsExactRequestAndPolicy|TestAuthorizationOwnerCommandRejectsUnknownStaleAndMismatchedFacts|TestAuthorizationOwnerCommandCanonicalAuthenticationStrength|TestAuthorizationOwnerCommandFailClosedExceptions|TestAuthorizationOwnerCommandRestartAndCanonicalReplay|TestAuthorizationOwnerCommandProductionSourceOwnership)$'
        > artifacts/authorization/owner-command/tests.json
      - python3 -c 'import json; required={'"'"'TestAuthorizationOwnerCommandUsesCanonicalEngine'"'"',
        '"'"'TestAuthorizationOwnerCommandRejectsUnknownStaleAndMismatchedFacts'"'"', '"'"'TestAuthorizationOwnerCommandRejectsCallerAuthority'"'"',
        '"'"'TestAuthorizationOwnerCommandRestartAndCanonicalReplay'"'"', '"'"'TestAuthorizationOwnerCommandBindsExactRequestAndPolicy'"'"',
        '"'"'TestAuthorizationOwnerCommandFailClosedExceptions'"'"', '"'"'TestAuthorizationOwnerCommandProductionSourceOwnership'"'"',
        '"'"'TestAuthorizationOwnerCommandCanonicalAuthenticationStrength'"'"'}; rows=[json.loads(s) for
        s in open('"'"'artifacts/authorization/owner-command/tests.json'"'"') if s.strip()]; passed={r.get('"'"'Test'"'"')
        for r in rows if r.get('"'"'Action'"'"')=='"'"'pass'"'"'}; assert required <= passed, sorted(required-passed);
        assert not any(r.get('"'"'Action'"'"') in ('"'"'skip'"'"','"'"'fail'"'"') for r in rows); print('"'"'all
        required named tests executed and passed'"'"')'
      - CGO_ENABLED=1 go test -race -count=1 ./internal/authorization/...
      - go vet ./internal/authorization/...
      - python3 scripts/release/package_component.py --component authorization --kind platform-core-dependency-source
        --input internal/authorization --bundle artifacts/authorization/owner-command/source-bundle.tar.zst
        --component-manifest artifacts/authorization/owner-command/component-manifest.json --digest-output
        artifacts/authorization/owner-command/bundle-digest.txt --ownership-baseline contracts/release/source-ownership-baseline.yaml
