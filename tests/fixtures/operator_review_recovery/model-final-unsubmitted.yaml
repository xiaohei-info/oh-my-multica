blockers:
- root_cause_key: modelcatalog-audit-commit-atomicity
  obligation_id: integration:model-catalog-gate
  classification: deeper
  owner: model-catalog
  severity: high
  summary: Two immediate finalization attempts are not a durable recovery protocol; attempted probes can remain
    permanently in progress.
  impact: A persistence/audit outage spanning both attempts, or a process exit after provider invocation, leaves
    the committed claim non-terminal. Even after the store recovers, same-key retries return ErrProbeInProgress
    indefinitely; an older successful probe can remain selectable without evidence of the later unknown attempt.
  evidence: 'Static inspection: application.go:410-452 commits the reservation and keeps attemptStarted only
    in process memory; application.go:506-540 tries result persistence and one Unknown fallback, then returns
    on the second error. store.go:277-288 returns ErrProbeInProgress whenever the existing record has no Probe.
    ProbeIdempotencyClaim at types.go:474-483 contains no persisted attempt/recovery context, and Store/transaction
    ports at types.go:735-767 expose no reconciliation operation. The independently passing TestPostAttemptFinalizeFailurePersistsUnknownAndReconciles
    (review_regressions_test.go:568-618) injects only one transient failure; it does not exercise failure of
    both writes or restart recovery. No additional failure experiment was constructed.'
  required_fix: Define a restart-safe pending-attempt/recovery contract with sufficient durable identity/context
    and a governed reconciliation path. Once persistence is available again, reconcile the reserved attempt
    to a terminal redacted Unknown without repeating the external message; preserve atomic canonical audit
    evidence. Add deterministic owning regressions for both finalize writes failing, store recovery, and restart
    after the external attempt, including selection safety.
- root_cause_key: modelcatalog-governed-auth-audit-boundary
  obligation_id: dimension:evidence
  classification: deeper
  owner: model-catalog
  severity: high
  summary: Canonical audit DTOs are populated with the external request ID rather than persisted RequestContext
    identity, and selection audit time is backdated.
  impact: The events cannot reliably join to the authoritative persisted governance context when its ID differs
    from request_id. A store enforcing that identity can reject otherwise valid commands; a permissive store
    retains misleading provenance. SelectModel records occurrence at the snapshot creation time rather than
    the actual selection time, distorting audit chronology.
  evidence: application.go:896-903 assigns AuditEvent.RequestContextID = requestContext.RequestID for all events.
    All five command inputs carry RequestContext but no separate persisted-context identity or canonical audit
    preparation receipt; contracts/identity/requestcontext/request_context.go:34-44 exposes only RequestID.
    docs/references/governance/security-and-enterprise.md:305-317 explicitly distinguishes persisted request_context_id
    from external request_id. The canonical AuditEvent.Validate at contracts/governance/audit/contract.go:360-399
    checks presence/shape, not this store linkage, and review_regressions_test.go:139 repeats the same conflation.
    application.go:624 passes snapshot.CreatedAt as the selection event occurrence time. For comparison, internal/agents/definitions/definitions.go:463-480
    passes an explicit RequestContextID to the owning audit preparation and atomic publication boundaries.
  required_fix: Carry the Platform Core-owned persisted RequestContext identity (or obtain a canonical prepared
    audit fact/receipt through its port), bind it to the authenticated context, and use it without substituting
    RequestID. Record selection occurrence using the injected current clock. Add an owning regression with
    distinct persisted-context/request IDs and a selection time later than discovery; keep governance persistence
    ownership outside model-catalog.
- root_cause_key: modelcatalog-probe-response-validation
  obligation_id: dimension:execution
  classification: new
  owner: model-catalog
  severity: medium
  summary: All three message connectors mark any readable 2xx HTTP response as a successful model probe without
    validating the protocol result.
  impact: A response that does not establish a completed model operation still becomes ProbeSucceeded and satisfies
    exact selection. This can incorrectly present an incompatible or unusable provider/model as ready.
  evidence: providers/http.go:152-160 checks only body-read bounds and HTTP status. providers/openai.go:43-46
    and :93-96 and providers/anthropic.go:54-57 discard the response bytes and unconditionally return Succeeded:true.
    The independently rerun full suite includes TestOpenAIResponsesAndChatErrorBranches (providers/coverage_test.go:74-85),
    which explicitly treats a 204 empty Responses response as success; TestOpenAIChatCompletionsTestMessageUsesExactProtocolShape
    (providers/providers_test.go:65-85) similarly asserts success on an empty object. Application.go:462-503
    persists the resulting green probe, and :598-610 accepts it for selection. This is evidence from the declared
    suite and static inspection, not an extra network experiment.
  required_fix: Validate a bounded minimal success response for the selected message protocol, including completed-success
    versus acceptance/error/non-result semantics, before reporting Succeeded. Convert malformed or non-terminal
    results to canonical failed/unknown observations as appropriate and never persist raw response content.
    Replace success fixtures that encode invalid responses and add protocol-negative tests for each connector.
nits: []
regression_notes:
- Governed production constructor and test-only helper isolation fixed the exported unauthenticated-constructor
  defect; all commands validate RequestContext and scope.
- Canonical AuditEvent transactions now bind mutation/audit together rather than calling an audit writer before
  commit; remaining failures concern canonical linkage and durable recovery, not the old split commit.
- Nil provider egress policy now fails closed; application policy runs before credential resolution and adapter
  policy before injection; redirects are not followed.
- Typed NonSecretHeader projections replace raw header maps, with bounded identifier/name policy applied consistently
  at persistence and HTTP boundaries.
- Manual model writer, manual source/merge/digest and model-manual conformance inputs are removed; the authoritative
  removal option is satisfied without modifying or packaging manual owner sources.
- Snapshot publication checks connection revision/configuration digest and predecessor under one transaction;
  probe key now includes exact snapshot ID.
- Parent-context timeout/cancellation after an attempt records canonical Unknown in normal persistence conditions,
  and retries bind complete request digest without another provider call.
- One immediate Unknown fallback repairs fail-once persistence only; the durable recovery root is deeper, not
  fixed.
evidence_boundary: Only declared local repository verification was executed. No additional security-negative
  payloads, attack experiments or external network probing were constructed. Findings beyond declared assertions
  are static inspections, explicitly labeled; reports omit credential material, raw sensitive inputs and network
  targets.
