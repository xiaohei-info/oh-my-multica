              - >-
                go test ./internal/identity/... ./api/auth/local/... -run "Test.*(CanonicalAudit|RequestContext|EvaluatedControl|ProofAudit|PersistedContext)" -count=1
              - >-
                python3 -c "from pathlib import Path; import re,subprocess; p=Path('artifacts/identity-local/coverage.out'); assert p.is_file() and p.stat().st_size>0; out=subprocess.check_output(['go','tool','cover','-func='+str(p)],text=True); m=re.search(r'^total:\s+\(statements\)\s+([0-9.]+)%$',out,re.M); assert m and float(m.group(1)) >= 90"
              - >-
