        delivery_goal: 'Deliver the complete protocol-neutral public harness.oac.dev/v1
          SDK boundary with typed Describe, execute, observe, cancel, result, and
          error unions; preserve exact Package/entrypoint, Extension/binding, operation,
          owner, subject, scope, request digest, and service payload digest through
          every public binding path. Remove every public authority constructor that
          lets a caller choose both Host signing and trust verification inputs, and
          expose only the package-neutral consumer/verification side of opaque service
          and Gate handoffs. The SDK must define a usable Host-facing ingress contract
          without implementing the Host producer: arbitrary callers and ExtensionPackages
          must be unable to mint an authoritative RequestScope, GateEvaluatorBinding,
          receipt, or evaluator invocation. Replace the obsolete missing-symbol regression
          with a structurally valid attempt against the current public API and prove
          zero binding, receipt, and evaluator calls. Remove all SDK-owned or same-package
          test-only Host authority bridges. Every SDK-local fixture must emit source-revision-bound
          measured evidence for its exact scoped assertion; the Gate consumer row
          may pass only by proving the negative boundary, must report registered_gate_positive_path_count=0
          and authoritative_gate_positive_claim_count=0, and must identify its scope
          as sdk-boundary rather than representing full Host-backed Gate conformance.
          Produce harness-sdk-boundary-evidence for the downstream harness-host producer.
          Preserve typed operation-schema validation, successful Trigger/EventHandler,
          bounded offline schema resolution, Required/Optional behavior, Unknown recovery,
          safe retry/cancel, coverage, race, vet, and deterministic sdk/harness packaging.
          The mandatory genuine Host-installed positive path and final combined semantic
          verdict remain downstream responsibilities of harness-host and contracts-extension.
          SDK-local positive operation conformance is not Host authorization: the
          fixed SDK conformance runner may execute ordinary typed Describe/Guide/Sensor/Executor/Trigger/EventHandler
          implementations with deterministic, non-authoritative request data and the
          same production input/response/schema/outcome validation and receipt-classification
          code. Its measured conformance records must be explicitly scoped sdk-operation-conformance,
          must not construct trusted RequestScope, service/Gate handoffs or authoritative
          receipts, and must never be usable by production authority entry points.
          A helper-only predicate or direct implementation call that bypasses the
          shared validation/measurement path is insufficient. Preserve successful
          Trigger output and all three successful EventHandler lifecycle operations;
          error-only implementations must fail these positive fixtures. Production
          typed Guide/Sensor/Trigger/EventHandler paths must finish response and output-schema
          validation before accepting a receipt; invalid results yield rejected/failed
          measured outcomes, while valid business-error envelopes retain a separate
          failed business outcome and never count as positive operation success. Optional
          side-effecting failures may become skipped only when the external failure
          outcome is known; structured Unknown and unstructured errors remain Unknown
          and require observation/recovery. SDK service/Gate rows are exclusively
          sdk-consumer-negative: reject even internally consistent caller handoffs
          without issuing a binding, authoritative receipt, or implementation/evaluator
          call. Envelope, rotation, replay, payload and identity assertions in these
          rows prove rejection of untrusted candidates, not authentication or durable
          replay enforcement. The Host-facing ingress contract must be package-neutral
          and implementable by the separately owned harness-host producer, not an
          unconditional rejecting stub or a caller-selectable verifier; document the
          exact release/entrypoint, binding, operation, owner, subject, scope, request/service-payload
          digest, component/run, policy and evaluator identity handoff. Host-owned
          verification, configured trust, expiry/rotation and replay enforcement remain
          in harness-host. The existing downstream dependency harness-host consumes
          harness-sdk-boundary-evidence and produces harness-host-gate-evidence at
          artifacts/harness-host/gate-evidence.json; contracts-extension consumes
          both and emits contracts-extension-final-conformance. Genuine service/Gate
          acceptance, authenticated handoff transport, accepted-then-replayed rejection
          across receivers/restart and genuine key rotation are mandatory Host conformance
          within that artifact, not SDK-local metrics or SDK prerequisites. Mark those
          downstream obligations not-run in SDK evidence, never passed, and do not
          add a reverse dependency. This clarification governs all existing test names,
          counters and historical decision references; no ordinary operation, schema,
          full identity, provenance, receipt, recovery or replay obligation is removed.
          The three newly required regression test names are authoring deliverables,
          not claims of existing passing tests: TestHarnessSDKTypedResponseValidationPrecedesReceiptAcceptance
          measures malformed response and output-schema violation for both Guide points,
          both Sensor points, Trigger, and EventHandler execute/observe/cancel (16
          rejected results), plus a valid business-error envelope for each of those
          eight paths without false business success. TestHarnessSDKOptionalUnknownFailureRequiresObservation
          measures structured outcome_known=false and unstructured errors, retains
          Unknown without skipped Observation or retry permission, and preserves Required
          blocking/known Optional failure observations. TestHarnessSDKConformanceEvidenceCannotAuthorizeHostIngress
          submits actual fixed-runner measurements/request data to the current production
          service/Gate boundary and proves no authority, bindings, authoritative receipts
          or implementation/evaluator calls. Keep these child executions in the existing
          typed-point-describe-contracts, required-optional-failure-policy and service/Gate
          consumer rows; the fixed selector still has exactly 13 measured semantic
          rows and seven current-amendment rows. No new row may be faked from test-name
          presence. Ordinary operation rows carry actual implementation call/result
          and validator/receipt-classification evidence with full target/operation/provenance
          identity; service cases are the 15 fixed case IDs checked by the gate. All
          exact counters derive from those actual parent/child executions, and forbidden-call
          counters count only calls forbidden for that assertion, not legitimate calls
          in ordinary positive fixtures. Staged coverage policy, effective only after
          explicit human acceptance of this amendment: SDK-only raw unfiltered statement
          coverage must be at least 85%; this does not waive the whole-SDK 90% gate
          now required of downstream harness-host. Do not filter profiles, change
          coverage scope, pad the denominator, delete required behavior, manufacture
