  - blocker_id: BLK-1052672b58e4
    root_cause_key: system-upgrade-protocol-compatibility-presence-only
    obligation_id: dimension:execution
    summary: Platform API, internal Command/Report/Event and SDK compatibility checks
      are presence/health checks, not N/N-1 compatibility evidence.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime_mutations.go:47-51 marks
      platform-api from the current HTTP readiness and workload presence, command-report-event
      from CRD readiness/schema and Controller/Host presence, and sdk-service from
      Execution Host presence plus a nonempty OCI list. None consumes current/target
      protocol compatibility identities, supported adjacent-release evidence, or compatible
      API/SDK contracts. helpers.go:471-476 shows hasWorkloadResource checks only
      an indexed Deployment digest. deployment-and-operations-design.md:282,294,297-299
      requires N/N-1 checks before rollout. This finding comes from complete static
      inspection and the declared fixtures, not an additional network or bypass experiment.
    required_fix: Consume authoritative exact current/target compatibility evidence
      through the owning release/installer contract, validate the N/N-1 API, internal
      protocol and embedded SDK/service window, and fail closed when it is missing
      or incompatible. Exercise compatible, incompatible and unknown evidence with
      deterministic adapter fixtures; no new live-cluster gate is requested.
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-160b4d21ee37
    root_cause_key: system-upgrade-desired-template-as-running-convergence
    obligation_id: dimension:execution
    summary: Observed image/manifest and readiness evidence can declare convergence
      while only the desired Deployment template has changed and old replicas still
      serve.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime.go:151-189 obtains ActualWorkloads
      and ActualWorkloadManifests from the live Deployment spec/annotations, not running
      replicas. helpers.go:386-413 tests observedGeneration, total ready/available
      replicas and Available, but never updatedReplicas or full rollout completion.
      WaitReady uses the existing installer ProbeDeploymentAvailable (mutations.go:176-196;
      internal/installer/readiness_kubernetes.go:185-200), which likewise checks total
      readyReplicas, not updatedReplicas. A Kubernetes controller can have observed
      the new generation and still have Available=True and old ready replicas during
      RollingUpdate. The fixture patch reactor at kubernetes_runtime_test.go:1104-1130
      merges desired fields and preserves prior readiness without simulating a generation/replica
      transition; the target variants keep image digests unchanged.
    required_fix: Distinguish desired signed template identity from observed running
      rollout identity. Require all desired replicas updated and ready/available with
      no old replicas, plus generation-aligned evidence and target digest proof sufficient
      for each group. Add declared deterministic rollout fixtures with observedGeneration
      advanced but old replicas still ready, mixed images, delayed update and failed
      target readiness.
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-187ae9f7e862
    root_cause_key: system-upgrade-image-only-convergence
    obligation_id: dimension:execution
    summary: Signed Deployment manifests now converge, but rollback and complete status
      still omit the other release deployment resources.
    evidence: internal/systemrelease/upgrade/upgrade.go:516-531 performs compatibility/resource
      application only for upgrade; 532-565 rolls just four Deployment groups. cmd/oac-installer/upgrade/kubernetes_runtime_mutations.go:148-173
      applies only the selected Deployment. Non-Deployment resources are applied exclusively
      by ExpandCompatibility:88-103. kubernetes_runtime.go:146-191 validates live
      manifests only for those four Deployments; addReleaseResourceVersions at 217-232
      merely reads resource versions. The rollback fixture at kubernetes_runtime_test.go:540-577
      asserts Deployment patch order and status, not restoration of changed Service/ConfigMap/RBAC/NetworkPolicy/Ingress/PDB
      resources. deployment-and-operations-design.md:262-264,306 requires the previous
      deployment resources, with only compatible CRD/database expansions retained.
    required_fix: Restore and verify the previous signed non-schema deployment resources
      at appropriate reverse-rollout stages, and include resource-set convergence
      in installed-state/recovery/completion evidence. Explicitly preserve compatible
      CRD/database expansions rather than exempting every non-Deployment resource.
      Add changed ConfigMap/Service/RBAC/routing rollback and drift fixtures.
    status: open
    classification: deeper
    owner: system-upgrade
    last_evidence: Deployment ManifestDigest is now observed and checked by rollout/readiness/status;
      manifest-only upgrade and rollback fixtures pass. However only Deployments are
      restored during rollback and non-Deployment release convergence is omitted;
      same root remains open.
  - blocker_id: BLK-35ba12d900c4
    root_cause_key: system-upgrade-rollback-additive-crd-preflight
    obligation_id: dimension:execution
    summary: Rollback applies the forward CRD compatibility test in reverse and therefore
      rejects the additive schema upgrades it promises to roll back.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime_mutations.go:40-41 computes
      workflowCRDCompatible(snapshot.release, target.VerifiedRelease()) for both modes;
      lines 53-55 change only rollbackSupported, not the failed Required crd check.
      helpers.go:678-695 compares every currently served schema with the target and
      schemaBackwardCompatible:774-780 requires every current property in the target.
      After an allowed optional-field expansion N to N+1, target N naturally lacks
      that field. The production rollback fixture changes Deployment/Job annotations
      only (fixture_test.go:103-150), so it does not cover additive CRD rollback.
      deployment-and-operations-design.md:306 and detailed design:565 require retaining
      the expanded CRD while rolling services back.
    required_fix: 'Use mode-specific compatibility: assess previous services against
      the retained live expanded schema and the declared adjacent compatibility window,
      not whether the old manifest contains every newer field. Add a signed optional-field
      CRD expansion followed by rollback fixture and verify the new field remains
      installed.'
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-44d5a907d12f
    root_cause_key: system-upgrade-postcommit-recovery
    obligation_id: dimension:execution
    summary: Same-target recovery is rejected after release metadata has already been
      committed.
    evidence: internal/systemrelease/upgrade/upgrade.go:539-551 commits metadata before
      the final status and continuity reads and returns ErrOutcomeUnknown on a commit
      error. preflight:403-407 rejects every target whose version is equal to installed
      metadata, including this already-committed exact target. Therefore Execute's
      already-target branch at 539 is unreachable through a fresh normal preflight
      in that state. TestInterruptedUpgradeResumesFromObservedTargetState at upgrade_test.go:81-107
      interrupts Execution Host readiness; upgrade_flow_edges_test.go:72 tests a commit
      error before mutation, not a successful write with a lost response. deployment-and-operations-design.md:302
      requires same-target observation and idempotent continuation after lost responses
      or restart.
    required_fix: Recognize an exact already-installed target as a read-only verification/recovery
      path and finish actual-state, resource readiness and continuity validation without
      reapplying effects or changing previous-release lineage. Preserve rejection
      of downgrades and conflicting same-version digests. Add declared fixture coverage
      for applied-but-unacknowledged CommitRelease and interruption immediately after
      commit.
    status: fixed
    classification: fixed
    last_evidence: Core upgrade.go:413-418,502-515,693-699 admits exact committed-target
      read-only verification. TestSameTargetRetryAfterAppliedCommitIsReadOnly exercises
      applied commit with response loss, no replay and preserved previous lineage;
      runtime commit response loss and exact-target recovery fixtures also pass. The
      independent production binary-provenance defect is recorded separately, not
      hidden as a recurrence of the removed equal-version rule.
    owner: system-upgrade
  - blocker_id: BLK-5eaee605444c
    root_cause_key: system-upgrade-required-health-final-convergence
    obligation_id: dimension:execution
    summary: Successful release completion does not revalidate the target release
      complete Required health set.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime_helpers.go:479-490 selects
      only CRD/database/migration/ingress/Web API rules for compatibility readiness.
      mutations.go:188-196 waits only one DeploymentAvailable rule per group. internal/systemrelease/upgrade/upgrade.go:576-585
      then completes from Status and continuity. Runtime Status observation probes
      only the database (kubernetes_runtime.go:211-212) in addition to local Deployment
      status. Required ArtifactStorageReady, service reachability/RBAC and other signed
      readiness rules are not part of final target convergence; ingress/Web API probes
      run before the service rollouts and are not repeated after Web. deployment-and-operations-design.md:300,302
      explicitly requires final Required health and per-group compatible readiness.
    required_fix: Add target-bound final Required readiness convergence and appropriate
      stage-specific compatibility probes before advancing service groups. Preserve
      unknown/failed outcomes and stop completion on absent/stale evidence. Add deterministic
      fixtures where a dependency becomes unknown or fails after rollout and where
      target Web/API readiness does not converge.
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-bcafc0bbb9e1
    root_cause_key: system-upgrade-continuity-attribution
    obligation_id: dimension:evidence
    summary: Continuity allows status progress but still freezes the complete Workflow
      membership and all spec fields rather than protecting existing baselines from
      installer-attributable changes.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime_helpers.go:245-287 hashes
      every listed Workflow UID and entire spec into one digest. kubernetes_runtime_apply.go:45-60
      rejects any difference from that digest before each resource write. internal/systemrelease/upgrade/upgrade.go:496-497,511-512,584-585
      also require equality. Workflow specs include user-controlled desiredState (docs/references/cloud-native/kubernetes-resources.md:36-46,60-68),
      and normal orchestration may create child Workflows. The declared fixtures cover
      a pre-existing Workflow changing status to Succeeded (kubernetes_runtime_test.go:55-65,632-644),
      not legitimate object creation, retention deletion or user desired-state commands
      during upgrade. The existing-controller continuity requirement is deployment-and-operations-design.md:302,308
      and detailed design:565-567.
    required_fix: Protect the relevant immutable baselines of existing executions
      and prove the installer write boundary is read-only for business state, without
      treating normal owner-attributable object membership or desired-state changes
      as installer mutations. Add deterministic concurrent child-creation/retention/user-command
      fixtures and separately attributable forbidden-mutation evidence.
    status: open
    classification: deeper
    owner: system-upgrade
    last_evidence: Continuity now separates protected spec digest from installer-effect
      counts, ignores status progress/resourceVersion and tests ordinary status reconciliation.
      However a whole listed-object/all-spec equality requirement still rejects expected
      ordinary new child Workflows, cleanup and user desiredState changes. Same attribution
      root remains open.
  - blocker_id: BLK-c89acd25eaa8
    root_cause_key: system-upgrade-permission-preflight-omitted
    obligation_id: dimension:execution
    summary: Required Kubernetes mutation permissions are not established before upgrade
      starts writing resources.
    evidence: cmd/oac-installer/upgrade/production.go:125-181 loads clients and discovery/cluster
      identity, but performs no mutation-permission preflight. AssessCompatibility
      at kubernetes_runtime_mutations.go:20-56 contains only seven checks with no
      authorization/capability result. ExpandCompatibility records namespace metadata
      and acquires PendingTarget at 76-86 before attempting resource writes at 96-102.
      No SelfSubjectAccessReview or equivalent required-verb capability check is present
      in the added production path. deployment-and-operations-design.md:293 requires
      permission checks before confirmation and changes.
    required_fix: Before presenting a successful preflight, establish the exact required
      read/create/apply/update/delete/exec capabilities for the target resources and
      migration/readiness path using the existing installer authorization boundary.
      Missing or unknown permission evidence must block without writes. Add deterministic
      denied/unknown permission fixtures and verify no metadata/resource mutation
      precedes refusal.
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-d11f9fa55a5c
    root_cause_key: system-upgrade-create-unknown-uid-binding-recovery
    obligation_id: dimension:execution
    summary: A created signed resource cannot recover if its create response or the
      following UID-binding update is lost before the binding is recorded.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime_apply.go:140-155 creates
      the resource, returns immediately on any create error, and records the UID binding
      only afterward. On the next observation, a successful but unacknowledged create
      now exists; line 160-162 rejects it because bindings[key] is empty, before the
      exact-target match at 163. The same stranded state follows a successful create
      with an unsuccessful bindResourceUID update at 484-540. The declared tests cover
      acknowledged PVC creation/idempotent retry (kubernetes_runtime_test.go:403-460)
      and metadata response loss (220-262), but not this create-to-binding gap. deployment-and-operations-design.md:302
      requires same-target observation/idempotent continuation after lost responses
      or restart.
    required_fix: Persist sufficient bounded creation intent/ownership evidence and
      use actual-state observation to reconcile the acknowledged resource UID after
      an unknown create/binding outcome, while continuing to reject foreign or recreated
      objects. Do not blindly recreate or adopt. Add applied-but-unacknowledged create
      and interruption-before/after-UID-binding fixtures on the production adapter.
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-db240f6bd4d2
    root_cause_key: system-upgrade-schema-compatibility-unsupported-validation
    obligation_id: dimension:execution
    summary: The CRD backward-compatibility comparator silently accepts validation
      and structural semantics it does not evaluate.
    evidence: cmd/oac-installer/upgrade/kubernetes_runtime_helpers.go:703-815 inspects
      type/format/nullable/required/enum, selected bounds/pattern, properties/additionalProperties
      and items. It ignores other admission constraints including allOf/anyOf/oneOf/not,
      exclusive bounds, uniqueItems and x-kubernetes-validations, as well as Kubernetes
      list/map/preserve-unknown semantics. workflowCRDCompatible:691-694 treats its
      Boolean result as authoritative; AssessCompatibility then turns it into a Required
      pass. The existing comparator tests at kubernetes_runtime_test.go:652-682,740-768
      cover only the implemented subset. No additional negative test or sensitive
      payload was constructed.
    required_fix: Use the owning Kubernetes schema compatibility/conformance boundary,
      or conservatively reject changes to constraints and structural keywords not
      proven compatible. Cover newly restrictive validation and changed list/map/pruning
      semantics in declared fixtures alongside allowed optional-field expansion.
    status: open
    classification: new
    owner: system-upgrade
  - blocker_id: BLK-dcefb47a0264
    root_cause_key: system-upgrade-runtime-disconnected
    obligation_id: dimension:structure
    summary: No production runtime or executable installer path is connected to the
      new upgrade capability.
    evidence: cmd/oac-installer/upgrade/upgrade.go:1,16-24,26 defines a non-main package
      and requires injected Context/Release resolvers and a Runtime. internal/systemrelease/upgrade/upgrade.go:223-231
      declares the entire effect boundary. Repository-wide searches for AssessCompatibility,
      WaitCompatibilityReady, CommitRelease, ObserveContinuity and upgrade imports
      found implementations only in internal/systemrelease/upgrade/upgrade_test.go:253-359
      and cmd/oac-installer/upgrade/upgrade_test.go:393-471; the latter is the only
      caller/importer of the CLI library. The complete PR adds only these two libraries
      and their tests. The existing DynamicKubernetesInstaller implements installation-specific
      methods, not this upgrade Runtime.
    required_fix: Deliver and connect a production installer runtime and command entry
      point using the existing signed-release and installer infrastructure boundaries.
      Implement actual-state observations, compatibility/health probes, compatible
      migration execution, guarded idempotent/CAS mutations and release metadata handling.
      Exercise the connected path with deterministic adapter fixtures under the declared
      gate; this does not require a new live-cluster acceptance claim.
    status: fixed
    classification: fixed
    last_evidence: Production main, FileReleaseCatalog, exact kubeconfig loader and
      concrete KubernetesUpgradeRuntime are implemented and connected. Declared deterministic
      Run upgrade/rollback/runtime fixtures execute this adapter, including signed
      manifests, metadata CAS and migration Job operations. Entrypoint verification
      go test ./cmd/oac-installer exits 0 (no package-local tests). New production
      defects are listed independently rather than claiming this remains a missing
      implementation.
    owner: system-upgrade
  - blocker_id: BLK-f4274a3e8fe9
    root_cause_key: system-upgrade-running-binary-installed-release-coupling
    obligation_id: dimension:execution
    summary: Production release observation authenticates the running installer against
      the currently installed release, breaking upgrades when adjacent releases ship
      different installer binaries.
    evidence: cmd/oac-installer/upgrade/production.go:75-88 calls the strict LoadSignedRelease
      with catalog.installerBinary for every ResolveInstalled. kubernetes_runtime.go:110-115
      uses that method whenever the new release metadata exists. A legacy installation
      instead uses ResolveDigest:117-128, which skips running-binary authentication;
      ExpandCompatibility then writes that metadata baseline at kubernetes_runtime_mutations.go:76-79.
      NewProductionDependencies:189-205 obtains InstallerVersion independently from
      an environment string. The connected runtime fixtures replace ResolveInstalled
      with a plain Resolve at kubernetes_runtime_test.go:868-870; fixture variants
      reuse the same installer bytes (fixture_test.go:94,202-221). production_test.go:60-65
      confirms strict rejection for a nonmatching executable, but no adjacent-release/different-binary
      flow is exercised.
    required_fix: Authenticate the running executable and its version against its
      own trusted signed provenance before changes, independently verify installed/previous/target
      release payloads, and enforce the proven installer version against target compatibility.
      Do not require the executable to occur in whichever release is currently installed.
      Cover distinct N and N+1 installer binaries, legacy bootstrap, postcommit recovery
      and rollback using the real FileReleaseCatalog.
    status: open
    classification: new
    owner: system-upgrade
