    expected: 验收项=`UJ-PUBLIC-ENTRY-001/STEP-02`。本步骤的可观察目标：准备 UJ-PUBLIC-ENTRY-001 的权威前置环境与测试数据。所有权威前置对象、身份、权限、状态与反例 Fixture 均已实际建立并经查询验证；Secret 仅以受控句柄提供。若缺少任何 setup/seed、环境句柄或故障注入能力，标记 implementation prerequisite 未满足并停止本次执行，不得临场猜造测试数据。
  - step: ACT-UJ-PUBLIC-ENTRY-001-01：清除登录状态和站点本地偏好，设置浏览器首选语言为 `zh-CN` 后访问无语言前缀入口，确认进入对应中文 Route；将浏览器语言改为不支持的 locale，确认进入 `en-US` fallback
    how: Action ID=`ACT-UJ-PUBLIC-ENTRY-001-01`。使用本 flow 已签收的测试环境、主体和 Fixture；直接按本 Action 唯一命名的页面、产品区域、控件、CLI 子命令、API operation 或连续操作顺序执行：清除登录状态和站点本地偏好，设置浏览器首选语言为 `zh-CN` 后访问无语言前缀入口，确认进入对应中文 Route；将浏览器语言改为不支持的 locale，确认进入 `en-US` fallback。找不到同名表面、同名表面存在歧义或必须改用 owning design 未定义的替代入口即失败；不得改记为 ENTRY prerequisite 或由 QA 猜造入口。保存与 Action ID 关联的页面截图/录屏、CLI stdout/stderr 或 API 请求响应。来源：`docs/delivery/acceptance-and-validation.md:L70-L87`。
