  - blocker_id: BLK-0675c00874c5
    root_cause_key: held-wait-snapshot-commands-read-obsolete-historical-path
    obligation_id: integration:agentrun-malformed-marker-causal-fixture-gate
    summary: The declared snapshot recipe is no longer connected to the current test
      output; independent reproduction copies stale historical four-scenario evidence
      instead of seven current scenarios.
    evidence: main_test.go:413-415 writes artifacts/agentrun-malformed-marker-fixture/held-wait-process-evidence.jsonl.
      Contract commands 4, 6 and 10 and published diagnosis.md:49,51,55 instead copy
      artifacts/agentrun-cancellation-prerequisite/held-wait-process-evidence.jsonl.
      Independent focused/scope JSON streams show all seven scenarios; the exact copy
      products each have only startup without acceptance, malformed stream, persistent
      append failure and runtime timeout. Full-suite copy likewise has four. Those
      copied bytes equal the retained historical file (2745 bytes, SHA256 8957ee77a264b913a588c8fe8fb079d3ca0b897349bb131727ba786865a1f948).
      Published snapshots have seven, so they require an unrecorded corrective capture
      step; verify_evidence.py:459-465 rejects four-scenario snapshots and :643-645
      requires focused snapshot/log equality.
    required_fix: Preserve the new namespace and historical files. Explicitly record
      in env_setup and command/exit inventory the corrected snapshot captures from
      artifacts/agentrun-malformed-marker-fixture/held-wait-process-evidence.jsonl
      immediately after each producing command (including coverage); do not silently
      attribute those bytes to the obsolete cp commands. Regenerate/retain source-bound
      snapshots and publication using that declared recipe, and independently demonstrate
      all seven current records plus focused-log equality without restoring author
      bytes over failed fresh snapshots. Retain this failed reproduction evidence;
      no fixture/lifecycle deadline relaxation or historical artifact overwrite.
    status: open
    classification: new
    owner: codex-ubuntu-newapi
