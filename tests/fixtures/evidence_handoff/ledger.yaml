  - blocker_id: BLK-169609a51ab4
    root_cause_key: nested-held-wait-control-overwrites-sibling-evidence
    obligation_id: dimension:evidence
    summary: The nested legacy control still truncates the shared held-Wait evidence
      and erases the required sibling records.
    evidence: main_test.go:413-418 writes nil to the fixed artifacts/agentrun-cancellation-prerequisite/held-wait-process-evidence.jsonl
      on each invocation. TestMalformedStreamMarkerEvidenceControls at main_test.go:918-919
      runs TestBuiltEntrypointHoldsOriginalWaitAcrossCleanupDeadlines in a subprocess
      after the parent invocation. The immutable evidence publication has exactly
      one JSONL record in each held-wait snapshot, with scenario malformed legacy
      marker publication window and deadlines_checked_seconds [10]. verify_evidence.py
      does not parse those snapshots to enforce completeness.
    required_fix: Give parent and nested invocations independent test-only evidence
      paths or merge records without truncation. Snapshot every producing command
      before later invocations, publish all five scenarios with the original deadline
      assertions, and make the verifier reject missing, duplicate or overwritten sibling
      records.
    status: open
    classification: new
    owner: codex-ubuntu-newapi
  - blocker_id: BLK-2ebb49b74749
    root_cause_key: missing-built-chain-negative-input-publication-controls
    obligation_id: integration:agentrun-malformed-marker-causal-fixture-gate
    summary: Absent/unwritten malformed input and failed marker publication are still
      not exercised through the real built ownership chain.
    evidence: main_test.go:883-908 constructs processIdentity and malformedFixtureMarker
      values in memory for all absent/unwritten/partial-write controls. The only built-chain
      legacy/positive controls use successful writes. testdata/vendor/main.go:348-350
      returns from the write-error branch, but no test selects a deterministic write/publication
      failure through Job -> driver -> adapter -> Runtime. writeMalformedMarker errors
      are discarded at lines 342, 354, 364 and 372. test_verify_evidence.py only tests
      temporary bytes, mappings and mocked retrieval failure.
    required_fix: Add bounded test-only built-chain schedules for absent/unwritten
      malformed bytes and failed trigger-marker publication, assert no false trigger
      or lifecycle completion, retain actual Wait/reaping and terminal facts separately,
      and preserve the existing decoder/verifier unit controls. Handle fixture publication
      errors explicitly.
    status: open
    classification: new
    owner: codex-ubuntu-newapi
  - blocker_id: BLK-f3b2bdbbff98
    root_cause_key: published-marker-verifier-does-not-bind-trigger-identity
    obligation_id: integration:agentrun-malformed-marker-source-publication-gate
    summary: The Python publication verifier still accepts process records whose markers
      are not bound to the expected trigger as one causal chain.
    evidence: verify_evidence.py:320-323 only requires prepared.trigger_id to be non-empty.
      Its positive branch at 337-339 checks phase/length/signal/process but not marker
      schema, trigger_id, or equality with prepared.trigger_id. Its legacy branch
      at 332-335 compares cancellation.trigger_id only to written.trigger_id and does
      not bind either to prepared.trigger_id or an expected scenario trigger. test_verify_evidence.py
      has no process-record foreign/mismatched-trigger negative control. The current
      verifier nevertheless returned 0 after validating 33 immutable artifacts, proving
      the semantic gap is not caught by the publication check.
    required_fix: Validate exact marker schemas and expected per-scenario trigger
      IDs in verify_malformed_process_record, require equality across prepared/write/cancellation/positive
      records and the expected scenario, and add permanent verifier negative controls
      for foreign and mismatched trigger records.
    status: open
    classification: new
    owner: codex-ubuntu-newapi
