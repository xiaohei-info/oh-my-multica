objective: Deliver the public MCP OpenAPI and HTTP adapter over the canonical governed
  MCP use case, with system-owned resource identity, binding-only public secret fields,
  exact RequestContext/authorization/admission lineage, complete materialization-proof
  validation, structural request/response/error parity, and reproducible final-head
  release evidence.
non_goals:
- Do not own or reimplement MCP persistence, authorization, execution admission, credential
  resolution, audit, Runtime, Workspace, or production service composition in the
  API adapter.
- Do not accept caller-authored mcp_server_definition_id, caller-asserted non-secret
  values, inline Header or Environment secrets, synthetic governance facts, or incomplete
  runtime proof.
- Do not expose in-process-only fields, undocumented error bodies or statuses, provider
  payloads, authorization headers, credential material, private prompts, or feature-local
  fallback paths.
- Do not use test fakes, temporary release-tooling revisions, or commands that are
  incompatible with the final reviewed head as release evidence.
verification_commands:
- mkdir -p artifacts/api-mcp && go test -covermode=atomic -coverprofile=artifacts/api-mcp/coverage.out
  ./api/openapi/mcp/... ./internal/httpapi/mcp/...
- go test ./api/openapi/mcp/... ./internal/httpapi/mcp/... -run '^(TestOpenAPIWireContractMatchesHandlers|TestCreateRejectsCallerAuthoredDefinitionIdentity|TestPublicValuesRequireCredentialBindings|TestCanonicalGovernanceRequestLineage|TestMaterializationRequiresExactBindingPurposeAndLaunchProof)$'
  -count=1
- python3 -c "from pathlib import Path; import re,subprocess; p=Path('artifacts/api-mcp/coverage.out');
  assert p.is_file() and p.stat().st_size>0; out=subprocess.check_output(['go','tool','cover','-func='+str(p)],text=True);
  m=re.search(r'^total:\s+\(statements\)\s+([0-9.]+)%$',out,re.M); assert m and float(m.group(1))
  >= 90"
- go list ./api/openapi/mcp/... | grep -q . && go generate ./api/openapi/mcp/... &&
  git diff --exit-code -- api/openapi/mcp && test -z "$(git ls-files --others --exclude-standard
  -- api/openapi/mcp)"
- python3 scripts/release/package_component.py --component api-mcp --kind platform-core-dependency-source
  --input api/openapi/mcp --input internal/httpapi/mcp --generated-input artifacts/mcp-catalog-governed-hardening/component-manifest.json
  --require-generated-input-digest --bundle artifacts/api-mcp/source-bundle.tar.zst
  --component-manifest artifacts/api-mcp/component-manifest.json --digest-output artifacts/api-mcp/bundle-digest.txt
  --ownership-baseline contracts/release/source-ownership-baseline.yaml --owner api-mcp
  --require-all-owner-sources-accounted
- python3 scripts/release/verify_component_manifest.py --manifest artifacts/api-mcp/component-manifest.json
  --bundle artifacts/api-mcp/source-bundle.tar.zst --expected-component api-mcp --check-schema
  schemas/release-component-manifest.schema.json --require-owned-source api/openapi/mcp/types.go
  --require-owned-source internal/httpapi/mcp/service.go --require-generated-input
  artifacts/mcp-catalog-governed-hardening/component-manifest.json --ownership-catalog
  contracts/release/source-ownership-catalog.yaml --require-all-owner-sources-accounted
