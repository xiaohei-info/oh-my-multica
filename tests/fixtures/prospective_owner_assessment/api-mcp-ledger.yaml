    requires those fields, but its validator is not invoked by this adapter. Tests
    in internal/httpapi/mcp/service_test.go:476-503 ignore the lease argument and
    cover only target-name/mismatch cases.
  required_fix: Validate the full launch against the exact definition and ordered
    (CredentialBindingID, Target, Purpose) set and the subject-bound active leases,
    or require a trusted materialization proof that binds those values. Fail closed
    with blocked/unknown for any mismatch or incomplete payload, and add negative
    binding-ID/purpose tests.
