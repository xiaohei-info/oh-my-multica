  - blocker_id: BLK-006c632cb966
    root_cause_key: mcp-api.openapi-contract-drift
    obligation_id: dimension:structure
    summary: The published OpenAPI and error contract still does not describe the
      implemented public behavior.
    evidence: api/openapi/mcp/types.go:134-140 defines Descriptions but api/openapi/mcp/openapi.yaml:127-142
      omits it. ErrorResponse at types.go:267-271 and openapi.yaml:446-455 expose
      only code, message, and request_id, while UJ-EXTERNAL-AGENT-CLI-001 requires
      retryable and hint in conflict responses. The current schema tests only check
      for a few positive strings and do not detect these omissions.
    required_fix: Make one authoritative OpenAPI/error DTO shape that includes every
      accepted request/response field and the required retryable/hint semantics, regenerate
      openapi.gen.go through the exact released generator contract, and add schema-vs-handler
      tests for missing fields and error responses.
    status: open
    classification: deeper
    last_evidence: The generated contract now includes a typed MaterializedLaunch
      and the undocumented materialization request was removed, but the published
      schema still omits the implemented Descriptions field and retryable/hint error
      fields; the final-head release contract command also cannot validate this generated
      contract.
  - blocker_id: BLK-07f1a38b0b58
    root_cause_key: mcp-api.idempotency-not-enforced
    obligation_id: dimension:evidence
    summary: Idempotency replay is not stable or fail-safe across real retries and
      unknown commit outcomes.
    evidence: internal/httpapi/mcp/service.go:388-410 performs GetDefinition/UpdateDefinition
      before ReserveCommand at :429-430; commandIdentity at :770-771 includes request.RequestID,
      and service_test.go:375-377 includes that field in the fake reservation key.
      releaseIfNeeded at :739-745 releases on every non-committed return, including
      an indeterminate CommitCommand result. Existing replay coverage reuses the same
      RequestContext and does not exercise lost-response/new-request identity.
    required_fix: Use a durable stable command identity that excludes per-attempt
      RequestID while retaining immutable provenance separately; resolve replay before
      mutable CAS rejection, bind reservation/commit to canonical request digest and
      subject revision, and retain/observe an indeterminate reservation instead of
      releasing it until commit outcome is known.
    status: open
    classification: deeper
    last_evidence: Durable reservation/replay hooks were added, but replay identity
      is still bound to RequestContext.RequestID, Update rejects stale revisions before
      checking replay, and any commit error triggers reservation release. The prior
      idempotency/recovery root remains open with a narrower but consequential failure
      mode.
  - blocker_id: BLK-0af923b33075
    root_cause_key: mcp-api.noncanonical-governance-lineage
    obligation_id: dimension:authority
    summary: Admission and credential use still bypass the canonical governance contracts.
    evidence: internal/httpapi/mcp/service.go:56-68 defines AdmitMCP and AuthorizeMCPUse
      as local methods returning auditcontract.EvaluatedControl. service.go:666-697
      validates only control/outcome/rules/facts strings; Test at :512-526 passes
      definition references directly to MCPConnector without a credential lease, and
      MaterializationStatus at :584-596 does the same for RuntimeMaterializer. Canonical
      ExecutionAdmissionRequest/Decision and CredentialResolveRequest are defined
      in contracts/governance/admission/contract.go:52-63/471-553 and contracts/governance/credential/wire.go:619-656.
    required_fix: Use the canonical ExecutionAdmissionEngine and CredentialBroker
      ports, construct and validate exact request/subject/digest/owner/security/usage
      inputs, persist canonical admit/reject and credential-use evidence, and resolve
      each binding into a short-lived purpose- and subject-bound lease before Connector
      or Runtime use.
    status: open
    classification: deeper
    last_evidence: AuthorizationRequest and AuditEvent now alias canonical packages
      and denied outcomes are recorded, but AdmissionEngine and CredentialBroker still
      expose local audit-shaped ports without canonical admission request/decision
      or credential resolve/lease identity. Governance lineage remains incomplete.
  - blocker_id: BLK-73b0d5041f63
    root_cause_key: mcp-api.untrusted-runtime-materialization-context
    obligation_id: dimension:execution
    summary: Materialization status trusts caller-supplied runtime paths.
    evidence: internal/httpapi/mcp/handler.go:174-196 accepts an undocumented GET
      body and service.go:304-334 passes its WorkspaceRoot/AllowedPaths into filesystem-based
      MaterializeRuntime.
    required_fix: Remove client-controlled runtime paths; use a trusted runtime/workspace
      binding or return blocked/unknown, and keep launch materialization internal.
    status: fixed
    classification: fixed
    last_evidence: handler.go:175-195 no longer decodes WorkspaceRoot or AllowedPaths
      from the public status request; MaterializationRequest contains only RequestContext
      and ServerID, and runtime materialization is delegated to a trusted dependency.
      A separate launch-identity mismatch blocker is reported for the remaining result-validation
      gap.
  - blocker_id: BLK-ac001635f24b
    root_cause_key: mcp-api.runtime-materialization-result-mismatch
    obligation_id: dimension:execution
    summary: Materialization status reports ready for a Runtime launch that is not
      bound to the requested definition.
    evidence: internal/httpapi/mcp/service.go:596-608 converts the RuntimeMaterializer
      result and sets Status=ready without comparing it with definition.MCPServerDefinitionID,
      definition.Transport, definition.ConfigurationDigest, or credentialTargets(definition).
      api/openapi/mcp/types.go:367-389 validates only payload shape. The current fakeRuntimeMaterializer
      at internal/httpapi/mcp/service_test.go:407-414 deliberately returns fixed server/digest
      values unrelated to the requested definition, and tests at :124-130/:286-309
      assert ready without detecting the mismatch.
    required_fix: Validate the Runtime result against the queried definition and the
      canonical credential/admission evidence before returning ready; return blocked/unknown
      on any identity or digest mismatch and add a negative test with a mismatched
      launch.
    status: open
    classification: new
  - blocker_id: BLK-c22144122c6e
    root_cause_key: mcp-api.release-tooling-scope-expansion
    obligation_id: dimension:ownership
    summary: Shared release-tooling ownership was expanded outside this delivery boundary.
    evidence: The diff adds 180/11 lines to link_go_component.py and 101/3 lines to
      verify_generated_contract.py, outside the declared API scope and overlapping
      blocked release-artifact-tooling.
    required_fix: Split the release-tooling changes into the owning prerequisite or
      obtain an explicit DAG/contract amendment.
    status: fixed
    classification: fixed
    last_evidence: git diff main...HEAD --name-status contains only the 17 API/OpenAPI
      and internal/httpapi/mcp files; scripts/release/link_go_component.py and verify_generated_contract.py
      are absent from the final PR diff.
  - blocker_id: BLK-c69f4cc0b7ec
    root_cause_key: mcp-api.inline-secret-response
    obligation_id: dimension:regression
    summary: Manual definition inputs still rely on heuristic secret classification
      rather than a fail-closed non-secret boundary.
    evidence: api/openapi/mcp/types.go:403-454 applies isSensitiveName plus looksLikeSecretValue,
      where values only match a handful of prefixes or a whitespace-free length threshold.
      internal/mcp/types.go:409-453 also enforces names rather than a typed non-secret
      input. The import path strips detected values at internal/mcp/import.go:198-221,
      but that does not prove arbitrary manual Create/Update values are non-secret.
    required_fix: Reject raw environment/header values in public Create/Update unless
      they are an explicitly typed non-secret field, or require every value to be
      represented by a purpose-bound CredentialBinding; never persist or return a
      value based only on heuristic classification.
    status: open
    classification: deeper
    last_evidence: Create/Update now invoke validateNoInlineSecrets, but that check
      remains a prefix/length heuristic and accepts arbitrary credential-shaped values
      under non-sensitive names. It is not the fail-closed typed non-secret or explicit-binding
      boundary required by the prior fix.
  - blocker_id: BLK-d24b87fd226c
    root_cause_key: mcp-api.cross-scope-resource-mutation
    obligation_id: dimension:regression
    summary: Update/read isolation is not fail-closed across scopes.
    evidence: internal/httpapi/mcp/service.go:210-227 fetches by unconstrained ID
      and rewrites input.ScopeID from the caller context at :224 without checking
      the loaded definition scope; Test and MaterializationStatus lack the same equality
      check.
    required_fix: Constrain reads by authenticated scope, require scope equality before
      authorization/mutation, preserve persisted scope, and include exact subject
      digest in authorization and commit CAS.
    status: fixed
    classification: fixed
    last_evidence: Catalog.GetDefinition now receives the authenticated scope, the
      fake catalog enforces it, service.go:392-394/494-495/569-570 checks the loaded
      definition scope, and Update preserves previous.ScopeID; the scoped regression
      test passed.
  - blocker_id: BLK-d7fc58321943
    root_cause_key: mcp-api.undocumented-route-fallback
    obligation_id: dimension:structure
    summary: The HTTP handler routes undocumented paths and aliases through the update/test/materialization
      operations.
    evidence: internal/httpapi/mcp/handler.go:65-80 only calls TrimPrefix and defaults
      every unmatched path to updateDefinition; it does not first require the documented
      prefix or exact route shape. The same block accepts /test and /materialization-status
      aliases at :71-78, while openapi.yaml declares only :test and /materialization.
      handler_coverage_test.go:64-69 codifies the undocumented materialization-status
      alias rather than rejecting it.
    required_fix: Use exact route matching (including the documented prefix), return
      NotFound for unmatched paths, and remove or explicitly publish any aliases;
      add a regression test for an unmatched PUT path and each supported route.
    status: open
    classification: new
  - blocker_id: BLK-e4b1d79f0f32
    root_cause_key: mcp-api.release-contract-not-reproducible
    obligation_id: integration:api-mcp-gate
    summary: The contract-declared generated-contract and source-link commands do
      not run against the final PR HEAD.
    evidence: Independent final-head execution of the exact verify_generated_contract.py
      command exited 2 because scripts/release/verify_generated_contract.py:10-12
      requires --component-manifest and --generated-contract, not the contract's --root/--require-go-generate-directive/--expected-outputs-file
      flags. The exact link_go_component.py command exited 2 because scripts/release/link_go_component.py:35-39
      requires --component-manifest, --go-binaries-manifest, and --output, not the
      contract's entrypoint/bundle flags. The stable package_component.py and verify_component_manifest.py
      commands pass, but they do not make the two exact gate commands reproducible.
    required_fix: Either update the contract to the released tooling interface and
      regenerate the gate evidence, or land the owning release-tooling prerequisite
      before this gate is required; then rerun the exact commands at the final PR
      HEAD without temporary scripts.
    status: open
    classification: new
  - blocker_id: BLK-f8f297e18616
    root_cause_key: mcp-api.production-composition-unwired
    obligation_id: dimension:ownership
    summary: The delivered MCP API has no production composition or concrete governance/runtime
      owner wired in the repository.
    evidence: A repository-wide search at the delivered head found only internal/httpapi/mcp
      tests and helper definitions for NewHandler/New, Catalog, AdmitMCP, AuthorizeMCPUse,
      RuntimeMaterializer, and MCPConnector; no production call site or concrete implementation
      is present. The only successful end-to-end-shaped tests use newTestService/fakeCatalog/allowAllAdmission/allowAllCredentialBroker/fakeConnector
      in internal/httpapi/mcp/service_test.go:184-243.
    required_fix: Wire the handler through the owning production API composition root
      with the concrete Catalog and canonical governance, CredentialBroker, Connector,
      and trusted Runtime adapters, or explicitly split and gate this delivery with
      an executable downstream integration fixture before claiming the public MCP
      API is exposed.
    status: open
    classification: new
