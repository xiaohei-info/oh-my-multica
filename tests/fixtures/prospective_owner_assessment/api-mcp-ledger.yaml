blockers:
- blocker_id: BLK-006c632cb966
  root_cause_key: mcp-api.openapi-contract-drift
  obligation_id: dimension:structure
  summary: The public OpenAPI contract still does not describe all accepted request
    and response behavior.
  evidence: api/openapi/mcp/types.go:183-187 exposes TestMcpServerRequest.mcp_server_definition_id
    while api/openapi/mcp/openapi.yaml:206-215 omits it; handler.go:173-178 decodes
    the field but ignores it. handler.go:180-185 emits a 502 object containing error
    and snapshot, while openapi.yaml:89-90 provides no content schema. Handler error
    paths at handler.go:249-263 expose 403/404/405/503 responses that are not declared
    for the corresponding operations. The current OpenAPI test only checks string
    presence at api/openapi/mcp/mcp_test.go:34-48.
  required_fix: Choose one authoritative public DTO shape, remove in-process-only
    fields from public wire DTOs or document and enforce them, add explicit ErrorResponse
    schemas for every supported operation/status including the 502 wrapper, then regenerate
    and run structural schema-vs-handler tests.
  status: open
  classification: deeper
  first_seen_round: 1
  last_seen_round: 3
  seen_count: 3
  last_evidence: Descriptions, retryable, and hint were added to the OpenAPI/DTO,
    and generated drift checks pass separately. Remaining public shape drift includes
    the ignored TestMcpServerRequest identity field, the undocumented 502 body, incomplete
    error response declarations, and caller-authored definition identity.
- blocker_id: BLK-07f1a38b0b58
  root_cause_key: mcp-api.idempotency-not-enforced
  obligation_id: dimension:evidence
  summary: The service-level idempotency repair is not backed by a delivered durable
    reservation/replay implementation.
  evidence: internal/httpapi/mcp/service.go:120-149 defines the reservation/commit
    contract and service.go:428-438/477-487 now exercises replay before CAS and retains
    a reservation after commit is attempted; the corresponding tests pass. Repository-wide
    inspection found no production Catalog implementation or composition, so the fake
    reservation map in internal/httpapi/mcp/service_test.go:293-404 is the only exercised
    persistence behavior.
  required_fix: Deliver or wire the durable Catalog command-record implementation,
    prove atomic reservation/definition/snapshot/result/audit persistence, and add
    a restart/lost-response integration test that observes both committed replay and
    indeterminate outcomes.
  status: open
  classification: deeper
  first_seen_round: 1
  last_seen_round: 3
  seen_count: 3
  last_evidence: The current service now derives a stable reservation key without
    RequestContextID, reserves before Update CAS, and retains reservations after commit
    is attempted; the fresh-context and mutated-revision tests pass. The real durable
    Catalog/recovery implementation is absent, so production lost-response semantics
    remain unverified and are covered by the production-composition blocker.
- blocker_id: BLK-0af923b33075
  root_cause_key: mcp-api.noncanonical-governance-lineage
  obligation_id: dimension:authority
  summary: The API calls canonical-shaped ports but does not supply or verify authoritative
    governance identity and execution facts.
  evidence: internal/httpapi/mcp/service.go:697-710 puts the domain command digest
    in a requirement and compares the returned decision to that value instead of verifying
    a canonical full AuthorizationRequest digest. service.go:725-750 uses ScopeID
    as ProjectID, ComponentID/architecture/IsolationLevel "mcp-api", NetworkModeAllowed,
    and ComponentRun for every operation. service.go:558-586 resolves probe leases
    but commits only authorization/admission controls; service.go:594-668 resolves
    status leases without a credential-use audit handoff. The authoritative admission
    contract requires exact owner/resolved execution/security inputs at contracts/governance/admission/contract.go:329-351,
    and the governance design requires Credential Resolution and Audit in the canonical
    chain at docs/design/detailed/09-governance-and-security-detailed-design.md:27-45,462-474,553-572.
  required_fix: Connect the MCP use cases to the sole AuthorizationEngine, ExecutionAdmissionEngine,
    CredentialBroker, and canonical audit/credential-use ports. Derive an operation-specific
    exact subject, owner (or an explicit non-project owner boundary), resolved connector/runtime/workspace,
    network/security requirements, and canonical request digests from trusted facts;
    do not substitute ScopeID or feature labels.
  status: open
  classification: deeper
  first_seen_round: 1
  last_seen_round: 3
  seen_count: 3
  last_evidence: Canonical type signatures and lease validation replaced the former
    audit-shaped ports, but service.go still constructs non-authoritative admission
    ownership/execution facts and has no production canonical engine/broker composition
    or explicit credential-use evidence handoff.
- blocker_id: BLK-36816070c77b
  root_cause_key: mcp-api.caller-authored-definition-identity
  obligation_id: dimension:ownership
  summary: Create accepts a caller-authored MCP definition identity even though the
    authoritative contract assigns it to the system.
  evidence: docs/references/execution/agent-runtime.md:130-142 defines mcp_server_definition_id
    as a system-produced identity generated on first creation. api/openapi/mcp/types.go:94-106
    and openapi.yaml:216-230 expose it in ServerDefinitionInput, and internal/httpapi/mcp/service.go:309-366
    accepts it and skips NewID when present. The service tests also treat a caller-provided
    ID as the normal create path.
  required_fix: Remove mcp_server_definition_id from the public create input and always
    generate it server-side; keep any in-process compatibility alias out of the public
    wire schema, and add a test that a caller-supplied identity is rejected or ignored
    without changing the generated identity.
  status: open
  classification: new
  first_seen_round: 3
  last_seen_round: 3
  seen_count: 1
- blocker_id: BLK-73b0d5041f63
  root_cause_key: mcp-api.untrusted-runtime-materialization-context
  obligation_id: dimension:execution
  summary: Materialization status trusts caller-supplied runtime paths.
  evidence: internal/httpapi/mcp/handler.go:174-196 accepts an undocumented GET body
    and service.go:304-334 passes its WorkspaceRoot/AllowedPaths into filesystem-based
    MaterializeRuntime.
  required_fix: Remove client-controlled runtime paths; use a trusted runtime/workspace
    binding or return blocked/unknown, and keep launch materialization internal.
  status: fixed
  classification: fixed
  first_seen_round: 1
  last_seen_round: 2
  seen_count: 1
  last_evidence: handler.go:175-195 no longer decodes WorkspaceRoot or AllowedPaths
    from the public status request; MaterializationRequest contains only RequestContext
    and ServerID, and runtime materialization is delegated to a trusted dependency.
    A separate launch-identity mismatch blocker is reported for the remaining result-validation
    gap.
- blocker_id: BLK-ac001635f24b
  root_cause_key: mcp-api.runtime-materialization-result-mismatch
  obligation_id: dimension:execution
  summary: Materialization can report ready without proving that the launch consumed
    the exact credential bindings and complete launch payload requested.
  evidence: internal/httpapi/mcp/service.go:655-667 marks ready after validateMaterializedLaunch.
