requests:
  - group: agent-api
    existing_target: api-agent
    existing_issue_id: 01a1048e-0327-70a5-84b8-d2967af606ea
    missing_owner_capability: >-
      Project & Team Agent application commands and queries: logical Agent creation,
      catalog/history queries, template-backed immutable publication, server-owned
      model/runtime/preflight resolution, and the actual transport-to-owner mapping.
      Reuse existing blank publication and template normalization; do not put these
      semantics in HTTP or make inner application modules import API DTOs.
    requested_compensating_publication:
      proposed_node_id: agent-catalog-production-commands
      existing_semantic_source_root: internal/agents/definitions/**
      existing_release_owner_and_component: agent-definition
      requested_boundary: >-
        A separately authorized, independently reviewable compensating delivery
        under the Agent Definition application boundary. Keep completed
        agent-definition and agent-definition-audit-consumer-adaptation nodes,
        their historical contracts, PRs, artifacts and runtime facts immutable.
        Publish new source-bound evidence without relabelling historical artifacts.
      approval_status: not-authorized-by-current-existing-node-request
    existing_unchanged_prerequisite:
      node: resource-lifecycle
      scope: internal/lifecycle/**
      reason: >-
        Its existing contract already owns resource eligibility, reference
        protection, tombstones and immutable retention for Agent/Project/terminal
        Workflow. Consume that capability for Agent archive/restore/delete instead
        of implementing a second lifecycle in the HTTP adapter or new publication
        owner. The snapshot has no work item or delivered implementation for it.
      proposed_effect: >-
        Add the genuine prerequisite to the future api-agent dependency/consumer
        contract. Do not resume or rewrite resource-lifecycle merely for coordination.
    later_minimum_operation_shape:
      - Add the separately authorized Agent application compensating delivery.
      - Update api-agent dependency and complete consumer contract to consume it and resource-lifecycle, retaining all original public-contract findings and gates.
    recovery_stage:
      api-agent: authoring
      rationale: >-
        The original delivery has no production owner composition and incomplete
        public error/governance contracts; review-only or merging recovery cannot
        supply implementation. The new node is unstarted authoring work, not a
        reopened DONE producer. There are no already-started descendants of
        api-agent in the bound snapshot.
    source_evidence:
      - docs/design/detailed/02-project-and-agent-team-detailed-design.md:37-84,362-386
      - docs/references/project-and-team/project-and-agent-team.md:405-411
