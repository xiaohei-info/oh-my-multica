submission_boundary: >-
  This is a scope request, not an omac.dag-amendment/v1 proposal. The installed
  existing-node owner-assessment route refuses new IDs and requires every actual
  changed/derived target in allowed_nodes. It offers no amendment-phase work-block
  report template. Do not relabel this request as a supported amendment, omit
  derived targets, fabricate an operation to pass the shallow submit parser, or
  use direct platform writes to bypass that boundary. The coordinator must first
  resolve the exact additional owner/publication scope through an authorized
  route, then obtain a complete schema-valid proposal and fresh independent review.
