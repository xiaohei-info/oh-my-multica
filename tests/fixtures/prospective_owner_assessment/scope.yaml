      - BLK-9beec89d4933
  - group: mcp
    existing_target: mcp-catalog-governed-hardening
    existing_issue_id: 01a103e4-4377-7af9-b3c9-dd1b118c6af1
    additional_existing_derived_target:
      node: api-mcp
      issue_id: 01a03ba6-c6c2-7e64-bb25-de46a3fe7e32
      requested_stage: authoring
      reason: >-
        This is the only already-started descendant of MCP hardening in the bound
        snapshot. OMAC derives its recovery for an implementation-affecting MCP
        amendment even when it is omitted from explicit operations. It is outside
        allowed_nodes. Fresh full Source/control/budget binding and authorization
        are required before any recovery; its current hold classification is not
        supplied by the current request and must not be guessed.
    requested_compensating_publications:
      - capability: canonical MCP catalog transaction composition
        proposed_node_id: mcp-platform-transaction-composition
        semantic_owner: Platform Core catalog/command transaction application boundary
        proposed_primary_root: internal/platformcore/mcp/**
        requested_boundary: >-
          Implement actual production-capable atomic catalog/CommandRecord/AuditEvent
          persistence and durable reservation/replay against the canonical platform
          database. Preserve Unknown reservations and distinguish persisted
          request_context_id from external RequestContext.RequestID. Reuse canonical
          governance evaluators and audit/credential owners. A new root needs an
          explicit additive source-release ownership/publication decision; it must
          not be smuggled into mcp-catalog, platform-agentrun or audit-ledger ownership.
        approval_status: new-owner-and-source-publication-authorization-required
      - capability: consumed MCP launch proof through the actual AgentRun execution path
        proposed_node_id: agentrun-mcp-consumption-evidence
        existing_semantic_source_roots:
          - internal/agentrun/**
          - cmd/agentrun-job/**
          - internal/platformcore/agentrun/**
        requested_boundary: >-
          Authorize the smallest additive AgentRun Job/Platform Core receipt path
          that proves actual launch consumption and binds the exact launch, runtime,
          workspace, configuration and credential-use identities. A materialized
          path or matching hash is not consumption. Preserve existing Runtime SDK
          protocol neutrality, SDK compatibility, event/ACK/cancellation behavior,
          and sole Platform Core persistence. Narrow the exact changed files and
          independently publish each affected historical source component before
          implementing; no reopening of DONE agent-run-job, platform-agentrun or
          runtime-sdk-mcp-launch-compatibility is authorized.
        approval_status: compensating-owner-and-publication-authorization-required
    required_unchanged_owner_interfaces:
      - authorization
      - execution-admission
      - credential-store
      - audit-ledger
      - Existing Runtime and Workspace contracts and production capabilities
    constraint: >-
      These owner names are input responsibilities, not blanket permission to
      mutate or recover their nodes. Any necessary contract/source change must be
      added to a fresh exact authorization. platform-core-entrypoint remains the
      final physical composition consumer; using it as an upstream semantic store
      would reverse the current dependency direction and create a cycle.
    later_minimum_operation_shape:
      - Admit independently authorized compensating transaction and consumed-launch publications.
      - Update MCP hardening's complete contract and genuine prerequisites while preserving all four original blockers and the five original commands.
      - Include api-mcp in the actual authorized derived recovery set; do not add an unnecessary explicit resume operation solely to repeat a derived recovery.
    recovery_stage:
      mcp-catalog-governed-hardening: authoring
      api-mcp: authoring
      rationale: >-
        Production persistence/consumption and governed application implementation
        remain absent. Neither review-only nor merging is justified. Unstarted
        descendants remain definitions/prerequisite consumers; do not reset the
        entire downstream release/acceptance graph.
    source_evidence:
