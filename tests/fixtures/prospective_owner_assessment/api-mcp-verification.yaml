commands:
  - cmd: "mkdir -p artifacts/api-mcp && go test -covermode=atomic -coverprofile=artifacts/api-mcp/coverage.out ./api/openapi/mcp/... ./internal/httpapi/mcp/..."
    exit_code: 0
    summary: "MCP API and HTTP adapter tests passed with 90.2% combined statement coverage."
  - cmd: "python3 -c \"from pathlib import Path; import re,subprocess; p=Path('artifacts/api-mcp/coverage.out'); assert p.is_file() and p.stat().st_size>0; out=subprocess.check_output(['go','tool','cover','-func='+str(p)],text=True); m=re.search(r'^total:\\s+\\(statements\\)\\s+([0-9.]+)%$',out,re.M); assert m and float(m.group(1)) >= 90\""
    exit_code: 0
    summary: "Coverage artifact exists and exceeds the 90% contract threshold at 90.2%."
  - cmd: "go list ./api/openapi/mcp/... | grep -q . && go generate ./api/openapi/mcp/... && git diff --exit-code -- api/openapi/mcp && test -z \"$(git ls-files --others --exclude-standard -- api/openapi/mcp)\""
    exit_code: 0
    summary: "Stable generator discovery, regeneration, generated-output drift, and untracked-output checks passed."
  - cmd: "python3 scripts/release/package_component.py --component api-mcp --kind platform-core-dependency-source --input api/openapi/mcp --input internal/httpapi/mcp --bundle artifacts/api-mcp/source-bundle.tar.zst --component-manifest artifacts/api-mcp/component-manifest.json --digest-output artifacts/api-mcp/bundle-digest.txt --ownership-baseline contracts/release/source-ownership-baseline.yaml --owner api-mcp --require-all-owner-sources-accounted"
    exit_code: 0
    summary: "The stable release packager produced the deterministic API-MCP source bundle, manifest, and digest."
  - cmd: "python3 scripts/release/verify_component_manifest.py --manifest artifacts/api-mcp/component-manifest.json --bundle artifacts/api-mcp/source-bundle.tar.zst --expected-component api-mcp --check-schema schemas/release-component-manifest.schema.json --require-owned-source api/openapi/mcp/types.go --require-owned-source internal/httpapi/mcp/service.go --ownership-catalog contracts/release/source-ownership-catalog.yaml --require-all-owner-sources-accounted"
    exit_code: 0
    summary: "Stable manifest verification passed schema, bundle, source ownership, and digest checks."
  - cmd: "python3 scripts/release/verify_generated_contract.py --root api/openapi/mcp --require-go-generate-directive --require-generator-package ./api/openapi/mcp/generator --expected-outputs-file api/openapi/mcp/generated-files.txt && go list ./api/openapi/mcp/... | grep -q . && go generate ./api/openapi/mcp/... && git diff --exit-code -- api/openapi/mcp && test -z \"$(git ls-files --others --exclude-standard -- api/openapi/mcp)\""
    exit_code: 0
    summary: "The exact contract command passed with the prerequisite release-tooling revision; the shared scripts were restored before delivery."
  - cmd: "python3 scripts/release/link_go_component.py --component-manifest artifacts/mcp-catalog/component-manifest.json --entrypoint-input internal/httpapi/mcp --entrypoint-input api/openapi/mcp --bundle artifacts/api-mcp/source-bundle.tar.zst --component-manifest artifacts/api-mcp/component-manifest.json --digest-output artifacts/api-mcp/bundle-digest.txt --require-all-input-digests --ownership-baseline contracts/release/source-ownership-baseline.yaml --owner api-mcp --require-all-owner-sources-accounted"
    exit_code: 0
    summary: "The exact contract command passed with the prerequisite release-tooling revision; the shared scripts were restored before delivery."
