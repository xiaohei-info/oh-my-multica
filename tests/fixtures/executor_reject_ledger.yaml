  - blocker_id: BLK-f8f891daf84d
    root_cause_key: platform-resource-stale-release-artifact-lineage
    obligation_id: dimension:evidence
    summary: The delivered component still has no retrievable current-head manifest
      or bundle.
    evidence: The complete PR diff contains only kernel_wire.go and kernel_wire_test.go,
      and git ls-files artifacts/contracts-platform-resource-executor-resolution-v1
      returns no paths. Current work-show exposes only PR URL/head and a YAML verification
      attachment; issue attachments have no bundle, manifest or digest. Independent
      packaging generated matching source_revision 208ba4f8 and passed schema/hash
      checks, but solely in an ignored local directory.
    required_fix: Publish the current-head Platform manifest, bundle and digest (with
      upstream input identities) as durable review-accessible artifacts outside the
      source tree, attach or identify their retrievable handles in delivery evidence,
      then verify those published bytes and their source revision/tree against the
      final PR head.
    status: open
    classification: deeper
    owner: contracts-platform-resource-executor-resolution-v1
    last_evidence: A current-head manifest and bundle can be independently recreated,
      but the worker removed the prior published files from PR delivery without publishing
      their replacements. Verification YAML alone is not the package artifact; no
      attached bundle or manifest exists.
