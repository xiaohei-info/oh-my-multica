  - blocker_id: BLK-f8f891daf84d
    root_cause_key: platform-resource-stale-release-artifact-lineage
    obligation_id: dimension:evidence
    summary: The delivered Platform component manifest and bundle identify an earlier
      source revision rather than the reviewed PR head.
    evidence: At PR head 338d79863, artifacts/contracts-platform-resource-executor-resolution-v1/component-manifest.json:1
      records source_revision 208ba4f8 and source_tree_sha 4f322756; HEAD's tree is
      f9bac739. Independent producer regeneration and package command produce a different
      upstream manifest digest and bundle digest. The previous bundle's internal verifier
      passes but does not compare its revision with HEAD. The amendment decision:13
      requires artifact lineage and gate outputs to describe the same corrected head.
    required_fix: Regenerate the declared upstream inputs and Platform release evidence
      for the final reviewed head, publish a package manifest and bundle bound to
      that head without circular tracked-artifact revision drift, and verify both
      internal hashes and provenance against that head.
    status: open
    classification: new
    owner: contracts-platform-resource-executor-resolution-v1
